name: FrontEnd Service CI/CD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev", "feature/**" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. JDK 설정 (Maven 빌드용)
      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 빌드 (소나큐브 제외!)
      - name: Maven 빌드
        run: mvn clean package -B -DskipTests

      # 4. Docker Hub 로그인
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 빌드 및 푸시
      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 프론트엔드 이미지 이름에 맞게 수정하세요
          tags: ${{ secrets.DOCKER_USERNAME }}/front-server:latest

      # 6. 서버 접속 및 배포 (인스턴스별 순차 배포 적용)
      - name: 서버 배포 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PW }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "🚀 Front Server (인스턴스 1, 2) 배포 시작..."
            cd ~/www/nhnbook

            SERVICE_BASE="front_server"

            # 두 개의 인스턴스(_1, _2)를 순차적으로 배포
            for i in 1 2; do
              CONTAINER_NAME="team5-${SERVICE_BASE}-${i}"
              SERVICE_NAME="${SERVICE_BASE}_${i}"
            
              echo "---------------"
              echo "🔄 [인스턴스 $i] 배포 진행 중: $SERVICE_NAME ($CONTAINER_NAME)"

              # 1. 기존 컨테이너 중지 및 제거 (명시적 수행)
              echo "🛑 기존 컨테이너 중지 및 제거..."
              docker stop $CONTAINER_NAME || true
              docker rm $CONTAINER_NAME || true
            
              # 2. 최신 이미지 pull 및 서비스 시작
              echo "📥 최신 이미지 Pull 및 컨테이너 시작..."
              # docker compose up -d가 pull을 포함하므로 한 줄로 처리 가능합니다.
              docker compose pull $SERVICE_NAME
              docker compose up -d $SERVICE_NAME

              # 다음 인스턴스 배포 전 잠시 대기 (선택 사항)
              echo "⏳ 안정화를 위해 5초 대기..."
              sleep 5
            done
            
            echo "---------------"
            docker image prune -f
            echo "✅ Front Server 모든 인스턴스 배포 완료!"