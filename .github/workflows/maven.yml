name: FrontEnd Service CI/CD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    # PR이 닫히는(closed) 시점을 감지하기 위해 types를 명시해야 합니다.
    # opened, synchronize, reopened는 기본값이지만 closed를 넣기 위해 모두 명시합니다.
    types: [opened, synchronize, reopened, closed]
    branches: [ "main", "dev" ]

jobs:
  build-deploy:
    # PR이 닫혔는데 머지되지 않고 그냥 닫힌 경우(closed but not merged)에는
    # 아예 이 잡을 실행하지 않도록 전체 조건을 걸어 불필요한 리소스 낭비를 막습니다.
    if: >
      github.event_name == 'push' ||
      github.event.action != 'closed' ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # [검증 단계] - PR 오픈, 동기화 시에도 항상 실행됨
      # ======================================================
      # 1. 코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. JDK 설정 (Maven 빌드용)
      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 빌드 (소나큐브 제외!)
      - name: Maven 빌드
        run: mvn clean package -B -DskipTests

      # ======================================================
      # [배포 단계] - PUSH거나 PR이 MERGE된 경우에만 실행됨
      # ======================================================
      # 4. Docker Hub 로그인
      - name: Docker Hub 로그인
        # [핵심 조건] PUSH 이벤트이거나 OR (PR 이벤트이고, 닫혔으며, 머지된 경우)
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 빌드 및 푸시
      - name: Docker 이미지 빌드 및 푸시
        # [핵심 조건] 위와 동일
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 프론트엔드 이미지 이름에 맞게 수정하세요
          tags: ${{ secrets.DOCKER_USERNAME }}/front-server:latest

      # 6. 서버 접속 및 배포 (인스턴스별 순차 배포 적용)
      - name: 서버 배포 (SSH)
        # [핵심 조건] 위와 동일
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PW }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "🚀 Front Server (인스턴스 1, 2) 배포 시작..."
            cd ~/www/nhnbook

            SERVICE_BASE="front_server"

            # 두 개의 인스턴스(_1, _2)를 순차적으로 배포
            for i in 1 2; do
              CONTAINER_NAME="team5-${SERVICE_BASE}-${i}"
              SERVICE_NAME="${SERVICE_BASE}_${i}"
            
              echo "---------------"
              echo "🔄 [인스턴스 $i] 배포 진행 중: $SERVICE_NAME ($CONTAINER_NAME)"

              # 1. 기존 컨테이너 중지 및 제거 (명시적 수행)
              echo "🛑 기존 컨테이너 중지 및 제거..."
              docker stop $CONTAINER_NAME || true
              docker rm $CONTAINER_NAME || true
            
              # 2. 최신 이미지 pull 및 서비스 시작
              echo "📥 최신 이미지 Pull 및 컨테이너 시작..."
              # docker compose up -d가 pull을 포함하므로 한 줄로 처리 가능합니다.
              docker compose pull $SERVICE_NAME
              docker compose up -d $SERVICE_NAME

              # 다음 인스턴스 배포 전 잠시 대기 (선택 사항)
              echo "⏳ 안정화를 위해 5초 대기..."
              sleep 5
            done
            
            echo "---------------"
            docker image prune -f
            echo "✅ Front Server 모든 인스턴스 배포 완료!"