<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
      <link rel="stylesheet" href="/member-css/signup.css">
  </head>
  <body>
  <header id="header" role="banner">
      <div class="container">
          <a href="./signup.html" class="logo">
              <img src="../img/logo.png" alt="HIGH-FIVE 로고" width="100" height="100" />
              <div class="brand">HIGH-FIVE BOOKS</div>
          </a>


          <nav class="gnb" aria-label="주요 메뉴">
              <div class="search-box" role="search">
                  <input
                          type="search"
                          placeholder="도서명, 저자, ISBN, 태그 검색"
                          aria-label="통합 검색"
                  />
                  <form method="get" action="/search">
                      <button class="search-btn"
                              aria-label="검색"
                              type="submit">
                          검색
                      </button>
                  </form>
              </div>
          </nav>

          <div class="user-menu">
              <!-- 쿠폰 -->
              <a class="user-link" href="/coupon">
                  <img src="../img/icon-coupon.png" alt="쿠폰" class="user-icon" />
              </a>

              <!-- 마이페이지 -->
              <a class="user-link" href="/mypage">
                  <img src="../img/icon-mypage.png" alt="마이페이지" class="user-icon" />
              </a>

              <!-- 장바구니 -->
              <a class="user-link" href="/cart">
                  <img src="../img/icon-cart.png" alt="장바구니" class="user-icon" />
              </a>

              <a class="user-link pill" th:href="@{/member/login.html}">로그인</a>
          </div>

      </div>
  </header>
    <main id="container">
      <div class="login-area">
        <h2 class="register-title">회원가입</h2>

        <form class="register-form">
          <div class="input-group">
            <label for="regName">이름</label>
            <input type="text" id="regName" placeholder="이름을 입력하세요" />
          </div>

          <div class="input-group">
            <label for="regEmail">이메일</label>
            <input
              type="email"
              id="regEmail"
              placeholder="이메일 주소를 입력하세요"
            />
          </div>

          <div class="input-group">
            <label for="regId">아이디</label>
            <input
              type="text"
              id="regId"
              placeholder="아이디를 입력하세요 (영문, 숫자 6~12자)"
            />
          </div>
          <div class="input-group">
            <label for="regPw">비밀번호</label>
            <input
              type="password"
              id="regPw"
              placeholder="비밀번호를 입력하세요"
            />
          </div>
          <div class="input-group">
            <label for="regPwConfirm">비밀번호 확인</label>
            <input
              type="password"
              id="regPwConfirm"
              placeholder="비밀번호를 다시 입력하세요"
            />
          </div>

          <div class="input-group">
            <label for="phoneNumber">연락처</label>
            <input
              type="number"
              id="phoneNumber"
              placeholder="핸드폰 번호를 입력하세요"
            />
          </div>

          <button type="submit" class="login-btn">가입하기</button>
        </form>
      </div>
    </main>
  </body>

  <footer id="footer">
    <div class="container">
      <div class="footer-links">
        <a href="#">회사소개</a>
        <a href="#">이용약관</a>
        <a href="#"><strong>개인정보처리방침</strong></a>
        <a href="#">관리자</a>
      </div>

      <div class="footer-info">
        <div class="copyright">
          <strong>대표이사 마르코</strong> | 사업자등록번호 123-456-7890<br />
          통신판매업신고 2024-광주동구-01211 | 이메일: marco@nhn.com<br />
          호스팅 제공자 NHN24 © NHN24. All Rights Reserved.
        </div>
        <div class="customer-center">
          <strong>고객센터 1544-8282</strong> (발신자 부담)<br />
          광주광역시 동구 서석동 조선대학교 1층 NHN아카데미<br />
          Fax 062-1234-5678
        </div>
      </div>
    </div>
  </footer>

  <script>
    // 1. 헤더의 로그인 버튼 요소를 찾습니다.
    const loginButton = document.querySelector(".login-btn-top");

    // 2. 버튼이 존재하면 클릭 이벤트를 연결합니다.
    if (loginButton) {
      loginButton.addEventListener("click", function () {
        // 3. 'login.html'로 페이지를 이동시킵니다.
        // (실제 파일 이름에 맞게 경로를 수정해야 합니다. 예: /login/index.html)
        window.location.href = "login.html";

        // 개발 중일 경우, alert로 확인 메시지를 띄울 수도 있습니다.
        // alert("로그인 페이지로 이동합니다.");
      });
    }
  </script>
</html>
