<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/member-css/signup.css">
</head>

<script src="/js/common.js"></script>
<script src="/js/signup.js"></script>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main id="container">
    <div class="login-area">
        <h2 class="register-title">회원가입</h2>
        <form class="register-form" action="/member/signup" method="post">
            <div class="input-group">
                <label for="regName">이름</label>
                <input type="text" id="regName" name="name" placeholder="이름을 입력하세요" />
            </div>

            <div class="input-group">
                <label for="regEmail">이메일</label>
                <input type="email" id="regEmail" name="email" placeholder="이메일 주소를 입력하세요" />
            </div>

            <div class="input-group">
                <label for="regId" class="writer">아이디</label>
                <div class="input-box">
                    <input
                            type="text"
                            id="regId"
                            name="loginId"
                            placeholder="아이디를 입력하세요 (영문, 숫자 6~12자)"
                    />
                    <button type="button" class="check-btn">중복확인</button>
                </div>
            </div>

            <div class="input-group">
                <label for="regPw">비밀번호</label>
                <input
                        type="password"
                        id="regPw"
                        name="password"
                        placeholder="비밀번호를 입력하세요 (8-20자)"
                />
            </div>

            <div class="input-group">
                <label for="regPwConfirm">비밀번호 확인</label>
                <input
                        type="password"
                        id="regPwConfirm"
                        placeholder="비밀번호를 입력하세요 (8-20자)"
                />
            </div>

            <div class="input-group">
                <label for="phoneNumber">연락처</label>
                <input type="text" id="phoneNumber" name="phone" placeholder="핸드폰 번호를 입력하세요" />
            </div>

            <div class="input-group">
                <label for="gender">성별</label>
                <select id="gender" name="gender" style="width: 100%; padding: 14px 15px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="MALE">남성</option>
                    <option value="FEMALE">여성</option>
                </select>
            </div>

            <div class="input-group">
                <label for="birthDate">생년월일</label>
                <input type="date" id="birthDate" name="birthDate" style="width: 100%; padding: 14px 15px; border: 1px solid #ddd; border-radius: 4px;" required />
            </div>

            <button type="submit" class="login-btn">가입하기</button>
        </form>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
