<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>

    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/member-css/signup.css">

    <style>
        .check-btn { cursor: pointer; white-space: nowrap; }
        .verify-msg { font-size: 12px; margin-top: 5px; }
        /* 인증/확인 완료 시 입력창 회색 처리 */
        .input-readonly { background-color: #e8f0fe; cursor: not-allowed; }
        .success-text { color: green; }
        .error-text { color: red; }

        .email-btns { display: flex; gap: 8px; }
        .email-btns .check-btn { white-space: nowrap; }
    </style>
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main id="container">
    <div class="login-area">
        <h2 class="register-title">회원가입</h2>
        <form class="register-form" action="/member/signup" method="post" id="signup-form">

            <div class="input-group">
                <label for="regName">이름</label>
                <input type="text" id="regName" name="name" placeholder="이름을 입력하세요" required />
            </div>

            <div class="input-group">
                <label for="regEmail">이메일</label>
                <div class="input-box" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                    <input type="email" id="regEmail" name="email"
                           placeholder="이메일 주소를 입력하세요" required style="flex:1; min-width:220px;" />

                    <div class="email-btns">
                        <button type="button" id="btn-send-email" class="check-btn">인증번호 받기</button>
                        <button type="button" id="btn-edit-email" class="check-btn" disabled>이메일 변경</button>
                    </div>
                </div>
            </div>

            <div class="input-group" id="email-verify-box" style="display: none;">
                <label for="email-code">인증번호</label>
                <div class="input-box">
                    <input type="text" id="email-code" placeholder="인증번호 6자리" maxlength="6">
                    <button type="button" id="btn-verify-code" class="check-btn">확인</button>
                </div>
                <p id="verify-message" class="verify-msg"></p>
            </div>

            <input type="hidden" id="emailVerified" value="false">

            <div class="input-group">
                <label for="regId" class="writer">아이디</label>
                <div class="input-box" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                    <input type="text" id="regId" name="loginId" placeholder="아이디를 입력하세요 (영문, 숫자 6~12자)" required style="flex:1; min-width:220px;" />

                    <div class="email-btns" style="display:flex; gap:8px; white-space:nowrap;">
                        <button type="button" id="btn-check-id" class="check-btn">중복확인</button>
                        <button type="button" id="btn-edit-id" class="check-btn" disabled>아이디 변경</button>
                    </div>
                </div>
                <p id="id-check-msg" class="verify-msg"></p>
            </div>

            <input type="hidden" id="idChecked" value="false">

            <div class="input-group">
                <label for="regPw">비밀번호</label>
                <input type="password" id="regPw" name="password" placeholder="비밀번호를 입력하세요 (8-20자)" required />
            </div>

            <div class="input-group">
                <label for="regPwConfirm">비밀번호 확인</label>
                <input type="password" id="regPwConfirm" placeholder="비밀번호를 입력하세요 (8-20자)" required />
            </div>

            <div class="input-group">
                <label for="phoneNumber">연락처</label>
                <input type="text" id="phoneNumber" name="phone" placeholder="핸드폰 번호를 입력하세요" required />
            </div>

            <div class="input-group">
                <label for="gender">성별</label>
                <select id="gender" name="gender" style="width: 100%; padding: 14px 15px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="MALE">남성</option>
                    <option value="FEMALE">여성</option>
                </select>
            </div>

            <div class="input-group">
                <label for="birthDate">생년월일</label>
                <input type="date" id="birthDate" name="birthDate" style="width: 100%; padding: 14px 15px; border: 1px solid #ddd; border-radius: 4px;" required />
            </div>

            <button type="submit" class="login-btn">가입하기</button>
        </form>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script src="/js/common.js"></script>

<script>
    const sendBtn = document.getElementById('btn-send-email');
    const verifyBtn = document.getElementById('btn-verify-code');
    const editEmailBtn = document.getElementById('btn-edit-email');

    const verifyBox = document.getElementById('email-verify-box');
    const emailInput = document.getElementById('regEmail');
    const verifiedInput = document.getElementById('emailVerified');

    const signupForm = document.getElementById('signup-form');

    const idCheckBtn = document.getElementById('btn-check-id');
    const editIdBtn = document.getElementById('btn-edit-id');
    const idInput = document.getElementById('regId');
    const idCheckMsg = document.getElementById('id-check-msg');
    const idCheckedInput = document.getElementById('idChecked');

    // CSRF
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

    const getHeaders = (type = 'application/json') => {
        const headers = { 'Content-Type': type };
        if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
        return headers;
    };

    function resetEmailVerification() {
        verifiedInput.value = "false";
        emailInput.readOnly = false;
        emailInput.classList.remove('input-readonly');

        verifyBox.style.display = 'none';
        sendBtn.disabled = false;
        sendBtn.innerText = "인증번호 받기";

        editEmailBtn.disabled = true;
        document.getElementById('email-code').value = "";
    }

    function resetIdCheck() {
        idCheckedInput.value = "false";
        idInput.readOnly = false;
        idInput.classList.remove('input-readonly');

        idCheckBtn.disabled = false;
        editIdBtn.disabled = true;

        idCheckMsg.innerText = "";
        idCheckMsg.className = "verify-msg";
    }

    sendBtn.addEventListener('click', () => {
        const email = emailInput.value;
        if (!email) {
            alert("이메일을 입력해주세요.");
            return;
        }

        sendBtn.disabled = true;
        sendBtn.innerText = "전송 중...";

        fetch('/auth/email/send', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ email })
        })
            .then(async res => {
                if (res.ok) {
                    alert("인증번호가 발송되었습니다.");
                    verifyBox.style.display = 'block';
                    sendBtn.innerText = "재전송";
                    sendBtn.disabled = false;
                } else {
                    const errorMessage = await res.text();
                    alert(errorMessage);

                    sendBtn.disabled = false;
                    sendBtn.innerText = "인증번호 받기";
                }
            });
    });

    verifyBtn.addEventListener('click', () => {
        const email = emailInput.value;
        const code = document.getElementById('email-code').value;

        if (!code) {
            alert("인증번호를 입력해주세요.");
            return;
        }

        fetch('/auth/email/verify', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ email, code, type: 'SIGNUP' })
        })
            .then(async res => {
                if (res.ok) {
                    alert("인증 성공!");

                    verifiedInput.value = "true";
                    emailInput.readOnly = true;
                    emailInput.classList.add('input-readonly');

                    sendBtn.disabled = true;
                    sendBtn.innerText = "인증 완료";

                    editEmailBtn.disabled = false;
                    verifyBox.style.display = 'none';
                } else {
                    alert("인증 실패");
                }
            });
    });

    editEmailBtn.addEventListener('click', () => {
        if (!confirm("이메일을 변경하면 다시 인증해야 합니다. 변경할까요?")) return;
        resetEmailVerification();
        emailInput.focus();
    });

    editIdBtn.addEventListener('click', () => {
        if (!confirm("아이디를 변경하면 다시 중복 확인을 해야 합니다. 변경할까요?")) return;
        resetIdCheck();
        idInput.value = "";
        idInput.focus();
    });

    idCheckBtn.addEventListener('click', () => {
        const loginId = idInput.value;
        if (!loginId) {
            alert("아이디를 입력해주세요.");
            return;
        }

        fetch(`/auth/check-id?loginId=${encodeURIComponent(loginId)}`, {
            method: 'GET',
            headers: getHeaders('application/json')
        })
            .then(async res => {
                if (!res.ok) throw new Error("통신 오류");
                const isDuplicate = await res.json(); // true(중복), false(사용가능)

                if (isDuplicate === false) {
                    alert("사용 가능한 아이디입니다.");
                    idCheckMsg.innerText = "사용 가능한 아이디입니다.";
                    idCheckMsg.className = "verify-msg success-text";
                    idCheckedInput.value = "true";

                    // 중복확인 완료 후 아이디 수정 방지(변경 버튼으로만 변경)
                    idInput.readOnly = true;
                    idInput.classList.add('input-readonly');
                    idCheckBtn.disabled = true;
                    editIdBtn.disabled = false;
                } else {
                    alert("이미 사용 중인 아이디입니다.");
                    idCheckMsg.innerText = "이미 사용 중인 아이디입니다.";
                    idCheckMsg.className = "verify-msg error-text";
                    idCheckedInput.value = "false";
                    resetIdCheck();
                    idInput.focus();
                }
            })
            .catch(err => {
                console.error(err);
                alert("중복 확인 중 오류가 발생했습니다.");
            });
    });

    idInput.addEventListener('input', () => {
        resetIdCheck();
    });

    signupForm.addEventListener('submit', (e) => {
        if (verifiedInput.value !== "true") {
            e.preventDefault();
            alert("이메일 인증을 완료해주세요!");
            return;
        }

        if (idCheckedInput.value !== "true") {
            e.preventDefault();
            alert("아이디 중복 확인을 해주세요!");
            return;
        }

        const pw = document.getElementById('regPw')?.value;
        const pwConfirm = document.getElementById('regPwConfirm')?.value;
        if (pw !== pwConfirm) {
            e.preventDefault();
            alert("비밀번호가 일치하지 않습니다.");
        }
    });
</script>
</body>
</html>
