<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서점 로그인</title>
    <link rel="stylesheet" href="/css/member-css/login.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <style>
        dialog::backdrop { background: rgba(0,0,0,0.5); }
        .btn2{
            display: flex;
            flex-direction: column;
            color: gray;
        }
        .findId2{
            display: flex;
            flex-direction: row;
            gap: 10px;
            color: gray;
        }

        .findId2:hover{
            color: black;
        }
    </style>
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main id="container">
    <div class="login-area">
        <div class="tab-menu">
            <button type="button" class="tab-btn active" id="tabMember">회원 로그인</button>
            <button type="button" class="tab-btn unactive" id="tabGuest">비회원 주문조회</button>
        </div>
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <form id="formMember" class="login-form" action="/auth/login" method="post">
            <div class="input-group">
                <label for="loginId">아이디</label>
                <div class="input-wrapper">
                    <input type="text" id="loginId" name="loginId" placeholder="아이디를 입력하세요" style="padding-right: 40px;"/>
                </div>
            </div>
            <div class="input-group">
                <label for="pwd">비밀번호</label>
                <div class="input-wrapper">
                    <input type="password" id="pwd" name="password" placeholder="비밀번호를 입력하세요" required />
                    <img class="input-icon" th:src="@{/img/free-icon-eye.png}" alt="보기" width="20" height="20"
                         onclick="togglePasswordVisibility('pwd', this)" />
                </div>
            </div>

            <div class="btn">
                <button type="submit" class="login-btn">로그인</button>
                <button type="button" class="login2-btn" onclick="location.href='/member/signup'">회원가입</button>
                <a href="https://id.payco.com/oauth2.0/authorize?response_type=code&client_id=3RDwsbe24b34tbkpVdYgqZB&serviceProviderCode=FRIENDS&redirect_uri=https://nhnbook.shop/login/oauth2/code/payco&userLocale=ko_KR" class="sns-btn payco">PAYCO 로그인</a>
            </div>

            <div class="find">
                <div class="btn2">
                    <div class="findId2">
                        <button type="button" class="findId" onclick="openFindIdDialog()">아이디찾기</button>
                        <button type="button" class="findPwd"
                                onclick="openPasswordResetDialog({ emailReadonly:false, redirectUrl:'/member/login?pwChanged=true' })">
                            비밀번호 찾기
                        </button>
                    </div>
                    <button type="button" class="dormant" onclick="openDormantDialog()">휴면 회원 해제</button>
                </div>
            </div>
        </form>

        <form id="formGuest" class="login-form" action="/orders/guest" method="post" style="display: none;" onsubmit="return checkGuestOrder(event)">
            <div class="input-group">
                <label for="orderId">주문 번호</label>
                <div class="input-wrapper">
                    <input type="number" id="orderId" name="orderId" placeholder="주문 번호를 입력하세요" required
                           style="width: 100%; height: 48px; padding: 0 12px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px;" />
                </div>
            </div>
            <div class="input-group">
                <label for="orderPassword">비밀번호</label>
                <div class="input-wrapper">
                    <input type="password" id="orderPassword" name="password" placeholder="주문 비밀번호를 입력하세요" required
                           style="width: 100%; height: 48px; padding: 0 12px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px;" />
                </div>
            </div>

            <div class="btn">
                <button type="submit" class="login-btn">주문 조회</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>

<dialog id="findIdDialog"
        style="padding: 20px; border: 1px solid #888; border-radius: 8px; width: 350px;
               position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
               margin: 0; z-index: 9999; background: white;">
    <div style="text-align: right;">
        <button type="button" onclick="closeFindIdDialog()"
                style="border:none; background:none; cursor:pointer; font-size:16px;">X</button>
    </div>

    <h3 style="margin-top:0;">아이디 찾기</h3>
    <p style="font-size:13px; color:#666;">가입한 이메일로 인증번호를 받아 입력하세요.</p>

    <input type="text" id="findIdName" placeholder="이름"
           style="width: 100%; padding: 8px; margin-bottom: 5px; box-sizing: border-box;">

    <div style="display: flex; gap: 5px; margin-bottom: 5px;">
        <input type="email" id="findIdEmail" placeholder="이메일"
               style="width: 65%; padding: 8px; box-sizing: border-box;">
        <button type="button" onclick="sendFindIdCode()"
                style="width: 35%; padding: 8px; cursor: pointer; font-size: 12px; background:#eee; border:1px solid #ddd;">
            인증번호 받기
        </button>
    </div>

    <div id="findIdStep2" style="display: none;">
        <input type="text" id="findIdCode" placeholder="인증번호 6자리"
               style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">

        <button type="button" onclick="submitFindId()"
                style="width: 100%; padding: 10px; background-color: #333; color: #fff; border: none; cursor: pointer;">
            아이디 찾기 확인
        </button>
    </div>

    <p id="findIdResultMsg"
       style="color: blue; font-weight: bold; text-align: center; margin-top: 15px; font-size: 14px; white-space: pre-wrap;"></p>
</dialog>

<dialog id="dormantDialog"
        style="padding: 20px; border: 1px solid #888; border-radius: 8px; width: 350px;
               position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
               margin: 0; z-index: 9999; background: white;">
    <div style="text-align: right;">
        <button type="button" onclick="closeDormantDialog()"
                style="border:none; background:none; cursor:pointer; font-size:16px;">X</button>
    </div>

    <h3 style="margin-top:0;">휴면 계정 활성화</h3>
    <p style="font-size:13px; color:#666;">아이디와 가입한 이메일을 입력해주세요.</p>

    <input type="text" id="dormantLoginId" placeholder="아이디 입력"
           style="width: 100%; padding: 8px; margin-bottom: 5px; box-sizing: border-box;">

    <div style="display: flex; gap: 5px; margin-bottom: 5px;">
        <input type="email" id="dormantEmail" placeholder="이메일 입력"
               style="width: 65%; padding: 8px; box-sizing: border-box;">
        <button type="button" onclick="sendDormantCode()"
                style="width: 35%; padding: 8px; cursor: pointer; font-size: 12px; background:#eee; border:1px solid #ddd;">
            인증번호 받기
        </button>
    </div>

    <div id="dormantStep2" style="display: none;">
        <input type="text" id="dormantAuthCode" placeholder="인증번호 6자리"
               style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">

        <button type="button" onclick="submitDormantActivation()"
                style="width: 100%; padding: 10px; background-color: #333; color: #fff; border: none; cursor: pointer;">
            인증 및 휴면 해제
        </button>
    </div>

    <p id="dormantMsg"
       style="color: blue; font-weight: bold; text-align: center; margin-top: 15px; font-size: 14px; white-space: pre-wrap;"></p>
</dialog>

<script>
    /* =============================
       아이디 찾기 로직
       ============================= */
    const findIdDialog = document.getElementById('findIdDialog');
    const findIdMsg = document.getElementById('findIdResultMsg');

    function openFindIdDialog() {
        findIdMsg.innerText = "";
        findIdMsg.style.color = "blue";
        document.getElementById('findIdName').value = "";
        document.getElementById('findIdEmail').value = "";
        document.getElementById('findIdCode').value = "";

        // [수정] Step2 숨기기
        const step2 = document.getElementById('findIdStep2');
        if(step2) step2.style.display = 'none';

        findIdDialog.showModal();
    }

    function closeFindIdDialog() {
        findIdDialog.close();
    }

    function sendFindIdCode() {
        const email = document.getElementById('findIdEmail').value;
        if (!email) { alert("이메일을 입력해주세요."); return; }

        findIdMsg.style.color = "black";
        findIdMsg.innerText = "전송 중...";

        fetch('/auth/email/find-id', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email })
        }).then(async res => {
            if (res.ok) {
                alert("인증번호가 발송되었습니다.");
                findIdMsg.style.color = "blue";
                findIdMsg.innerText = "인증번호를 입력해주세요.";

                const step2 = document.getElementById('findIdStep2');
                if(step2) step2.style.display = 'block';

            } else {
                findIdMsg.innerText = "";
                alert("발송 실패: " + await res.text());
            }
        });
    }

    function submitFindId() {
        const email = document.getElementById('findIdEmail').value;
        const code  = document.getElementById('findIdCode').value;

        if (!email || !code) { alert("이메일과 인증번호를 입력해주세요."); return; }

        fetch('/account/api/find/id', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email: email, code: code, type: 'FIND_ID' })
        }).then(async res => {
            if (res.ok) {
                const text = await res.text();
                findIdMsg.style.color = "green";
                findIdMsg.innerText = "찾은 아이디: " + text;
            } else {
                findIdMsg.style.color = "red";
                findIdMsg.innerText = await res.text();
            }
        });
    }
</script>

<div th:replace="~{layout/password-reset-dialog :: passwordResetDialog(null, false)}"></div>

<script src="/js/password-reset.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    (function () {
        const params = new URLSearchParams(location.search);
        if (params.get("needLogin") === "true") {
            Swal.fire({
                icon: "warning",
                title: "로그인이 필요합니다",
                text: "로그인 후 다시 시도해주세요.",
                confirmButtonText: "확인"
            }).then(() => history.replaceState(null, "", location.pathname));
        }
        if (params.get("pwChanged") === "true") {
            Swal.fire({
                icon: "success",
                title: "비밀번호 변경 완료",
                text: "새 비밀번호로 로그인해주세요.",
                confirmButtonText: "확인"
            }).then(() => history.replaceState(null, "", location.pathname));
        }
    })();

    async function checkGuestOrder(event) {
        event.preventDefault();
        const orderId = document.getElementById('orderId').value;
        const password = document.getElementById('orderPassword').value;

        if(!orderId || !password) {
            alert("주문번호와 비밀번호를 모두 입력해주세요.");
            return false;
        }
        try {
            const response = await fetch('/orders/guest/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId: orderId, password: password })
            });
            if (response.ok) {
                event.target.submit();
            } else if (response.status === 400) {
                const data = await response.json();
                alert(data.message || "주문 정보가 일치하지 않습니다.");
            } else {
                alert("시스템 오류가 발생했습니다.");
            }
        } catch (error) {
            console.error('Error:', error);
            alert("서버와 통신 중 오류가 발생했습니다.");
        }
        return false;
    }
</script>
</body>
</html>
