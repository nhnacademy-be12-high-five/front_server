
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서점 로그인</title>
    <link rel="stylesheet" href="/css/member-css/login.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/common.css">
</head>

<script src="/js/common.js"></script>
<script src="/js/login.js"></script>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main id="container">
    <div class="login-area">
        <div class="tab-menu">
            <button type="button" class="tab-btn active">회원 로그인</button>
        </div>
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <form class="login-form" action="/auth/login" method="post">
            <div class="input-group">
                <label for="loginId">아이디</label>
                <div class="input-wrapper">
                    <input type="text" id="loginId" name="loginId" placeholder="아이디를 입력하세요" style="padding-right: 40px;"/>
                </div>
            </div>
            <div class="input-group">
                <label for="pwd">비밀번호</label>
                <div class="input-wrapper">
                    <input
                            type="password"
                            id="pwd"
                            name="password"
                            placeholder="비밀번호를 입력하세요"
                            required
                    />
                    <img
                            class="input-icon" th:src="@{/img/free-icon-eye.png}"
                            alt="아이콘"
                            width="100"
                            height="100"
                            onclick="togglePasswordVisibility()"
                    />
                </div>
            </div>

            <button type="submit" class="login-btn" >로그인</button>
            <button type="submit" class="login2-btn" onclick="location.href='/member/signup.html'">회원가입</button>
        </form>

        <div class="sns-login">
<!--로컬 페이코-->
<!--            <a href="https://id.payco.com/oauth2.0/authorize?response_type=code&client_id=3RDJfC0EFpgMSp8pe7saxfn&serviceProviderCode=FRIENDS&redirect_uri=http://nhn.highfive:9000/login/oauth2/code/payco&userLocale=ko_KR"-->
<!--배포 페이코-->

            <a href="https://id.payco.com/oauth2.0/authorize?response_type=code&client_id=3RDwsbe24b34tbkpVdYgqZB&serviceProviderCode=FRIENDS&redirect_uri=https://nhnbook.shop/login/oauth2/code/payco&userLocale=ko_KR" class="sns-btn payco">
                PAYCO 로그인
            </a>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
