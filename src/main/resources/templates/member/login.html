
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서점 로그인</title>
    <link rel="stylesheet" href="/member-css/login.css">
</head>
<body>
<!-- 헤더 -->
<header id="header" role="banner">
    <div class="container">
        <a th:href="@{/}" class="logo">
            <img th:src="@{/img/logo.png}" alt="HIGH-FIVE 로고" width="100" height="100" />
            <div class="brand">HIGH-FIVE BOOKS</div>
        </a>

        <nav class="gnb" aria-label="주요 메뉴">
            <form class="search-box"
                  role="search"
                  th:action="@{/search}"
                  method="get">
                <input
                        type="search"
                        name="keyword"
                        placeholder="도서명, 저자, ISBN, 태그 검색"
                        aria-label="통합 검색"
                />
                <button type="submit" class="search-btn" aria-label="검색">검색</button>
            </form>

        </nav>

        <div class="user-menu">
            <!-- 쿠폰 -->
            <a class="user-link" href="/coupon">
                <img th:src="@{/img/icon-coupon.png}" alt="쿠폰" class="user-icon" />
            </a>
            <a class="user-link" href="/mypage">
                <img th:src="@{/img/icon-mypage.png}" alt="마이페이지" class="user-icon" />
            </a>
            <a th:href="@{/api/cart}" href="/api/cart" class="user-link cart-link-wrap">
                <img th:src="@{/img/icon-cart.png}" alt="장바구니" class="user-icon" />
                <span id="cartBadge" class="cart-badge" style="display: none;">0</span>
            </a>
            <a class="user-link pill" th:href="@{/member/login.html}">로그인</a>
        </div>

    </div>
</header>


<main id="container">
    <div class="login-area">
        <div class="tab-menu">
            <button type="button" class="tab-btn active" id="tabMember">회원 로그인</button>
            <button type="button" class="tab-btn unactive" id="tabGuest">비회원 주문조회</button>
        </div>

        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <form id="formMember" class="login-form" action="/auth/login" method="post">
            <div class="input-group">
                <label for="loginId">아이디</label>
                <div class="input-wrapper">
                    <input type="text" id="loginId" name="loginId" placeholder="아이디를 입력하세요" style="padding-right: 40px;"/>
                </div>
            </div>
            <div class="input-group">
                <label for="pwd">비밀번호</label>
                <div class="input-wrapper">
                    <input type="password" id="pwd" name="password" placeholder="비밀번호를 입력하세요" required />
                    <img class="input-icon" th:src="@{/img/free-icon-eye.png}" alt="보기"
                         onclick="togglePasswordVisibility('pwd', this)" />
                </div>
            </div>

            <div class="btn">
                <button type="submit" class="login-btn">로그인</button>
                <button type="button" class="login2-btn" onclick="location.href='/member/signup.html'">회원가입</button>

                <div class="sns-login">
                    <a href="https://id.payco.com/oauth2.0/authorize?response_type=code&client_id=3RDwsbe24b34tbkpVdYgqZB&serviceProviderCode=FRIENDS&redirect_uri=https://nhnbook.shop/login/oauth2/code/payco&userLocale=ko_KR"
                       class="sns-btn payco">
                        PAYCO 로그인
                    </a>
                </div>
            </div>
        </form>

        <form id="formGuest" class="login-form" action="/order/guest" method="post" style="display: none;">
            <div class="input-group">
                <label for="orderId">주문 번호</label>
                <div class="input-wrapper">
                    <input type="text" id="orderId" name="orderId" placeholder="주문 번호를 입력하세요" />
                </div>
            </div>
            <div class="input-group">
                <label for="guestPwd">주문 비밀번호</label>
                <div class="input-wrapper">
                    <input type="password" id="guestPwd" name="guestPassword" placeholder="주문 시 설정한 비밀번호" required />
                    <img class="input-icon" th:src="@{/img/free-icon-eye.png}" alt="보기"
                         onclick="togglePasswordVisibility('guestPwd', this)" />
                </div>
            </div>

            <button type="submit" class="login-btn">비회원 주문 조회</button>
        </form>
    </div>
</main>

<footer id="footer" role="contentinfo">
    <div class="footer-links">
        <a href="#">회사소개</a>
        <a href="#">이용약관</a>
        <a href="#"><strong>개인정보처리방침</strong></a>
        <a href="#">고객센터</a>
    </div>

    <div class="footer-info">
        <div>
            <strong>대표이사 마르코</strong> | 사업자등록번호 123-456-7890<br />
            통신판매업신고 2024-광주동구-01211 | 이메일: help@highfive.com<br />
            호스팅 제공자 NHN24 © HIGH-FIVE BOOKS. All Rights Reserved.
        </div>
        <div>
            <strong>고객센터 1544-8282</strong> (발신자 부담)<br />
            광주광역시 동구 서석동 조선대학교 1층 NHN아카데미<br />
            Fax 062-1234-5678
        </div>
    </div>
</footer>
</body>

    function togglePasswordVisibility(id, icon) {
        // 1. 넘겨받은 ID로 해당 input 찾기
        const inputField = document.getElementById(id);

        // 요소가 없으면 중단
        if (!inputField) {
            console.error("해당 ID의 input을 찾을 수 없습니다: " + id);
            return;
        }

        // 2. 타입 토글 및 아이콘 변경
        if (inputField.type === "password") {
            inputField.type = "text"; // 비밀번호 보이기
            // 클릭된 그 아이콘의 이미지를 변경
            icon.src = "/img/free-icon-closed-eyes.png";
        } else {
            inputField.type = "password"; // 비밀번호 숨기기
            icon.src = "/img/free-icon-eye.png";
        }
    }

    // ==== 1. 탭 전환 로직 ====
    const tabMember = document.getElementById("tabMember");
    const tabGuest = document.getElementById("tabGuest");
    const formMember = document.getElementById("formMember");
    const formGuest = document.getElementById("formGuest");


    // 회원 로그인 탭 클릭 시
    if (tabMember) {
        tabMember.addEventListener("click", function () {


            // 탭 스타일 변경
            tabMember.classList.add("active");
            tabMember.classList.remove("unactive");
            tabGuest.classList.add("unactive");
            tabGuest.classList.remove("active");

            // 폼 표시/숨김
            formMember.style.display = "block";
            formGuest.style.display = "none";
        });
    }

    // 비회원 주문조회 탭 클릭 시
    if (tabGuest) {
        tabGuest.addEventListener("click", function () {

            // 탭 스타일 변경
            tabGuest.classList.add("active");
            tabGuest.classList.remove("unactive");
            tabMember.classList.add("unactive");
            tabMember.classList.remove("active");

            // 폼 표시/숨김
            formMember.style.display = "none";
            formGuest.style.display = "block";
        });
    }
