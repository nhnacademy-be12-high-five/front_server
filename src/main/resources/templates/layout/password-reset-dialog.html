<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="passwordResetDialog(defaultEmail, emailReadonly)">
    <dialog id="passwordResetDialog"
            style="padding: 20px; border: 1px solid #888; border-radius: 8px; width: 350px;
               position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
               margin: 0; z-index: 9999; background: white;">
        <div style="text-align: right;">
            <button type="button" onclick="closePasswordResetDialog()"
                    style="border:none; background:none; cursor:pointer; font-size:16px;">X</button>
        </div>

        <h3 style="margin-top:0;">비밀번호 재설정</h3>
        <p style="font-size:13px; color:#666;">가입한 이메일로 인증번호를 받은 뒤 새 비밀번호를 설정하세요.</p>

        <div id="pwResetLoginIdRow" style="margin-bottom: 5px;">
            <label for="pwResetLoginId" style="display:block; font-size:12px; color:#666; margin-bottom:4px;">
                <span id="pwResetLoginIdLabel">아이디</span>
            </label>
            <input type="text" id="pwResetLoginId" placeholder="아이디"
                   style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc;">
        </div>

        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
            <input type="email" id="pwResetEmail" placeholder="이메일"
                   th:value="${defaultEmail}"
                   th:attr="readonly=${emailReadonly}"
                   style="width: 65%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc;"
                   th:style="${emailReadonly} ? 'width: 65%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; background:#f0f0f0; color:#555;' : 'width: 65%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc;'">
            <button type="button" id="pwResetSendBtn" onclick="sendPasswordResetCode()"
                    style="width: 35%; padding: 8px; cursor: pointer; font-size: 12px; background:#eee; border:1px solid #ddd;">
                인증번호 받기
            </button>
        </div>

        <div id="pwResetArea"
             style="display:none; margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;">
            <p style="font-size:12px; color:blue;">메일이 발송되었습니다.<br>인증번호와 새 비밀번호를 입력하세요.</p>

            <input type="text" id="pwResetAuthCode" placeholder="인증번호 6자리"
                   style="width: 100%; padding: 8px; margin-bottom: 5px; box-sizing: border-box;">

            <input type="password" id="pwResetNewPw" placeholder="새 비밀번호"
                   style="width: 100%; padding: 8px; margin-bottom: 5px; box-sizing: border-box;">

            <input type="password" id="pwResetNewPwConfirm" placeholder="새 비밀번호 확인"
                   style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">

            <button type="button" id="pwResetSubmitBtn" onclick="submitPasswordReset()"
                    style="width: 100%; padding: 10px; background-color: #333; color: #fff; border: none; cursor: pointer;">
                변경하기
            </button>
        </div>

        <p id="pwResetMsg"
           style="color: blue; font-weight: bold; text-align: center; margin-top: 15px; font-size: 14px; white-space: pre-wrap;"></p>
    </dialog>
</div>
</body>
</html>
