<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIGH-FIVE BOOKS | 도서 검색 결과</title>

    <!-- 도서 리스트 공통 CSS -->
    <link rel="stylesheet" href="/book-css/list.css">
</head>
<body>
<!-- =================== 헤더 =================== -->
<header id="header" role="banner">
    <div class="container">
        <!-- 로고 -->
        <a th:href="@{/}" class="logo">
            <img th:src="@{/img/logo.png}" alt="HIGH-FIVE 로고" width="100" height="100" />
            <div class="brand">HIGH-FIVE BOOKS</div>
        </a>

        <!-- 검색 박스 -->
        <nav class="gnb" aria-label="주요 메뉴">
            <form class="search-box"
                  role="search"
                  th:action="@{/search}"
                  method="get">
                <input type="search"
                       name="keyword"
                       placeholder="도서명, 저자, ISBN, 태그 검색"
                       aria-label="통합 검색"
                       th:value="${keyword}" />

                <!-- 정렬 기준 유지 -->
                <input type="hidden" name="sort"
                       th:value="${sort != null ? sort : 'POPULAR'}" />

                <!-- 일반 검색 버튼 -->
                <button type="submit"
                        class="search-btn"
                        aria-label="일반 검색">
                    검색
                </button>

                <!-- AI 검색 버튼: rag-search로 통일 -->
                <button type="submit"
                        class="search-btn ai"
                        aria-label="AI 검색"
                        th:formaction="@{/rag-search}">
                    AI 검색
                </button>
            </form>
        </nav>

        <!-- 우측 아이콘 메뉴 -->
        <div class="user-menu">
            <a class="user-link" th:href="@{/coupon}">
                <img th:src="@{/img/icon-coupon.png}" alt="쿠폰" class="user-icon" />
            </a>
            <a class="user-link" th:href="@{/mypage}">
                <img th:src="@{/img/icon-mypage.png}" alt="마이페이지" class="user-icon" />
            </a>
            <a class="user-link" th:href="@{/cart}">
                <img th:src="@{/img/icon-cart.png}" alt="장바구니" class="user-icon" />
            </a>
            <a class="user-link pill" th:href="@{/member/login.html}">로그인</a>
        </div>
    </div>
</header>

<!-- =================== 메인 =================== -->
<main id="container">
    <div class="container">
        <section class="category-page">
            <!-- 브레드크럼 -->
            <div class="breadcrumb">
                <span>홈</span>
                <span th:text="'검색: ' + ${keyword}">검색 키워드</span>
            </div>

            <!-- 상단 타이틀 + 전체 건수 -->
            <div class="category-header">
                <div>
                    <div class="category-title"
                         th:text="${keyword}">
                        검색 결과
                    </div>
                    <p class="category-desc">
                        <span th:text="${keyword}">키워드</span>
                        에 대한 도서 검색 결과입니다.
                    </p>
                </div>
                <div class="result-count">
                    총
                    <strong th:text="${pageInfo != null ? pageInfo.totalElements
                                       : (books != null ? #lists.size(books) : 0)}">
                        0
                    </strong>
                    권의 도서
                </div>
            </div>

            <!-- =================== AI 검색 말풍선 박스 =================== -->
            <!-- aiSummary 가 있을 때만 노출 -->
            <div class="ai-summary-box" th:if="${aiSummary != null}">
                <div class="ai-summary-title">
                    AI 검색 요약 · HIGH-FIVE 추천
                </div>
                <p class="ai-summary-text"
                   th:text="${aiSummary}">
                    이 키워드에 대해 AI가 요약한 추천/요약 내용이 표시됩니다.
                </p>
            </div>

            <!-- =================== 정렬/보기 옵션 =================== -->
            <div class="toolbar">
                <!-- 정렬 옵션: NORMAL / AI 분리 -->
                <!-- NORMAL 검색일 때 -->
                <div class="sort-options"
                     th:if="${searchType} == null or ${searchType} == 'NORMAL'">
                    <a th:href="@{/search(keyword=${keyword}, sort='POPULAR', page=0, searchType='NORMAL')}"
                       th:classappend="${sort} == 'POPULAR' ? ' active' : ''">
                        인기순
                    </a>
                    <a th:href="@{/search(keyword=${keyword}, sort='NEW', page=0, searchType='NORMAL')}"
                       th:classappend="${sort} == 'NEW' ? ' active' : ''">
                        신간순
                    </a>
                    <a th:href="@{/search(keyword=${keyword}, sort='LOW_PRICE', page=0, searchType='NORMAL')}"
                       th:classappend="${sort} == 'LOW_PRICE' ? ' active' : ''">
                        가격 낮은순
                    </a>
                    <a th:href="@{/search(keyword=${keyword}, sort='HIGH_PRICE', page=0, searchType='NORMAL')}"
                       th:classappend="${sort} == 'HIGH_PRICE' ? ' active' : ''">
                        가격 높은순
                    </a>
                    <a th:href="@{/search(keyword=${keyword}, sort='RATING', page=0, searchType='NORMAL')}"
                       th:classappend="${sort} == 'RATING' ? ' active' : ''">
                        평점순
                    </a>
                    <a th:href="@{/search(keyword=${keyword}, sort='REVIEW', page=0, searchType='NORMAL')}"
                       th:classappend="${sort} == 'REVIEW' ? ' active' : ''">
                        리뷰순
                    </a>
                </div>

                <!-- AI 검색일 때 -->
                <div class="sort-options"
                     th:if="${searchType} == 'AI'">
                    <a th:href="@{/rag-search(keyword=${keyword}, sort='POPULAR', page=0, searchType='AI')}"
                       th:classappend="${sort} == 'POPULAR' ? ' active' : ''">
                        인기순
                    </a>
                    <a th:href="@{/rag-search(keyword=${keyword}, sort='NEW', page=0, searchType='AI')}"
                       th:classappend="${sort} == 'NEW' ? ' active' : ''">
                        신간순
                    </a>
                    <a th:href="@{/rag-search(keyword=${keyword}, sort='LOW_PRICE', page=0, searchType='AI')}"
                       th:classappend="${sort} == 'LOW_PRICE' ? ' active' : ''">
                        가격 낮은순
                    </a>
                    <a th:href="@{/rag-search(keyword=${keyword}, sort='HIGH_PRICE', page=0, searchType='AI')}"
                       th:classappend="${sort} == 'HIGH_PRICE' ? ' active' : ''">
                        가격 높은순
                    </a>
                    <a th:href="@{/rag-search(keyword=${keyword}, sort='RATING', page=0, searchType='AI')}"
                       th:classappend="${sort} == 'RATING' ? ' active' : ''">
                        평점순
                    </a>
                    <a th:href="@{/rag-search(keyword=${keyword}, sort='REVIEW', page=0, searchType='AI')}"
                       th:classappend="${sort} == 'REVIEW' ? ' active' : ''">
                        리뷰순
                    </a>
                </div>

                <!-- 일반 검색 / AI 검색 결과 탭 -->
                <div class="view-options">
                    <a th:classappend="${searchType} == null or ${searchType} == 'NORMAL' ? ' active' : ''"
                       th:href="@{/search(keyword=${keyword}, sort=${sort}, page=0, searchType='NORMAL')}">
                        일반 검색
                    </a>
                    &nbsp;|&nbsp;
                    <a th:classappend="${searchType} == 'AI' ? ' active' : ''"
                       th:href="@{/rag-search(keyword=${keyword}, sort=${sort}, page=0, searchType='AI')}">
                        AI 검색 결과
                    </a>
                </div>
            </div>

            <!-- =================== 도서 카드 그리드 =================== -->
            <div class="book-grid">
                <!-- 검색 결과 없음 -->
                <div th:if="${books == null or #lists.isEmpty(books)}">
                    검색 결과가 없습니다.
                </div>

                <!-- 도서 카드 -->
                <a class="book-card"
                   th:each="book : ${books}"
                   th:href="@{/book/{id}(id=${book.id})}">
                    <div class="book-cover">
                        <img th:if="${book.image != null}"
                             th:src="${book.image}"
                             alt="도서 표지" />
                        <span th:if="${book.image == null}">도서 표지</span>
                    </div>

                    <h3 class="book-title" th:text="${book.title}">
                        도서 제목
                    </h3>

                    <p class="book-author">
                        <span th:text="${book.author}">저자</span>
                        <span th:if="${book.publisher != null}"
                              th:text="' · ' + ${book.publisher}">
                            · 출판사
                        </span>
                    </p>

                    <div class="book-price-row">
                        <div class="price-main">
                            <span class="amount"
                                  th:text="${book.price != null ?
                                           #numbers.formatInteger(book.price, 3, 'COMMA')
                                           : '-'}">
                                0
                            </span>
                            <span class="won">원</span>
                        </div>
                    </div>

                    <div class="book-meta" th:if="${book.avgRating != null}">
                        <span th:text="${#numbers.formatDecimal(book.avgRating, 1, 1)}">
                            0.0
                        </span>
                        점 (
                        <span th:text="${book.reviewCount}">0</span>건
                        )
                    </div>
                </a>
            </div>

            <!-- =================== 페이지네이션 =================== -->
            <!-- NORMAL 검색 페이지네이션 -->
            <div class="pagination"
                 th:if="${pageInfo != null and pageInfo.totalPages > 1
                         and (searchType == null or searchType == 'NORMAL')}">

                <a th:if="${pageInfo.page > 0}"
                   th:href="@{/search(
                         keyword=${keyword},
                         sort=${sort},
                         page=${pageInfo.page - 1},
                         searchType='NORMAL'
                   )}">
                    &lt;
                </a>

                <a th:each="pageNum : ${#numbers.sequence(0, pageInfo.totalPages - 1)}"
                   th:text="${pageNum + 1}"
                   th:classappend="${pageNum} == ${pageInfo.page} ? ' active' : ''"
                   th:href="@{/search(
                         keyword=${keyword},
                         sort=${sort},
                         page=${pageNum},
                         searchType='NORMAL'
                   )}">
                    1
                </a>

                <a th:if="${pageInfo.page < pageInfo.totalPages - 1}"
                   th:href="@{/search(
                        keyword=${keyword},
                        sort=${sort},
                        page=${pageInfo.page + 1},
                        searchType='NORMAL'
                   )}">
                    &gt;
                </a>
            </div>

            <!-- AI 검색 페이지네이션 -->
            <div class="pagination"
                 th:if="${pageInfo != null and pageInfo.totalPages > 1
                         and searchType == 'AI'}">

                <a th:if="${pageInfo.page > 0}"
                   th:href="@{/rag-search(
                         keyword=${keyword},
                         sort=${sort},
                         page=${pageInfo.page - 1},
                         searchType='AI'
                   )}">
                    &lt;
                </a>

                <a th:each="pageNum : ${#numbers.sequence(0, pageInfo.totalPages - 1)}"
                   th:text="${pageNum + 1}"
                   th:classappend="${pageNum} == ${pageInfo.page} ? ' active' : ''"
                   th:href="@{/rag-search(
                         keyword=${keyword},
                         sort=${sort},
                         page=${pageNum},
                         searchType='AI'
                   )}">
                    1
                </a>

                <a th:if="${pageInfo.page < pageInfo.totalPages - 1}"
                   th:href="@{/rag-search(
                        keyword=${keyword},
                        sort=${sort},
                        page=${pageInfo.page + 1},
                        searchType='AI'
                   )}">
                    &gt;
                </a>
            </div>

        </section>
    </div>
</main>
</body>
</html>
