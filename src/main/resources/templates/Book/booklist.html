<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIGH-FIVE BOOKS | 도서 리스트</title>
    <link rel="stylesheet" th:href="@{/book-css/list.css}">
</head>
<body>
<header id="header" role="banner">
    <div class="container">
        <a th:href="@{ / }" class="logo">
            <img th:src="@{/img/logo.png}" alt="HIGH-FIVE 로고" width="100" height="100" />
            <div class="brand">HIGH-FIVE BOOKS</div>
        </a>

        <nav class="gnb" aria-label="주요 메뉴">
            <!-- 검색 폼: sort 유지용 hidden 추가 -->
            <form class="search-box"
                  role="search"
                  th:action="@{/search}"
                  method="get">
                <input type="search"
                       name="keyword"
                       placeholder="도서명, 저자, ISBN, 태그 검색"
                       aria-label="통합 검색"
                       th:value="${keyword}" />
                <input type="hidden" name="sort" th:value="${sort != null ? sort : 'POPULAR'}"/>
                <button type="submit" class="search-btn" aria-label="검색">검색</button>
            </form>
        </nav>

        <div class="user-menu">
            <a class="user-link" href="/coupon">
                <img th:src="@{/img/icon-coupon.png}" alt="쿠폰" class="user-icon" />
            </a>
            <a class="user-link" href="/mypage">
                <img th:src="@{/img/icon-mypage.png}" alt="마이페이지" class="user-icon" />
            </a>
            <a class="user-link" href="/cart">
                <img th:src="@{/img/icon-cart.png}" alt="장바구니" class="user-icon" />
            </a>
            <a class="user-link pill" th:href="@{/member/login.html}">로그인</a>
        </div>
    </div>
</header>

<main id="container">
    <div class="container">
        <section class="category-page">
            <div class="breadcrumb">
                <span>홈</span>
                <span th:text="'검색: ' + ${keyword}">검색 키워드</span>
            </div>

            <div class="category-header">
                <div>
                    <div class="category-title" th:text="${keyword}">검색 결과</div>
                    <p class="category-desc">
                        <span th:text="${keyword}">키워드</span>
                        에 대한 도서 검색 결과입니다.
                    </p>
                </div>
                <div class="result-count">
                    <!-- 전체 건수: pageInfo.totalElements 사용 -->
                    총 <strong th:text="${pageInfo != null ? pageInfo.totalElements : 0}">0</strong>권의 도서
                </div>
            </div>

            <!-- 정렬 UI: 실제 /search 링크로 연결 -->
            <div class="toolbar">
                <div class="sort-options">
                    <a th:href="@{/search(keyword=${keyword}, sort='POPULAR', page=0)}"
                       th:classappend="${sort} == 'POPULAR' ? ' active' : ''">인기순</a>

                    <a th:href="@{/search(keyword=${keyword}, sort='NEW', page=0)}"
                       th:classappend="${sort} == 'NEW' ? ' active' : ''">신간순</a>

                    <a th:href="@{/search(keyword=${keyword}, sort='LOW_PRICE', page=0)}"
                       th:classappend="${sort} == 'LOW_PRICE' ? ' active' : ''">가격 낮은순</a>

                    <a th:href="@{/search(keyword=${keyword}, sort='HIGH_PRICE', page=0)}"
                       th:classappend="${sort} == 'HIGH_PRICE' ? ' active' : ''">가격 높은순</a>

                    <a th:href="@{/search(keyword=${keyword}, sort='RATING', page=0)}"
                       th:classappend="${sort} == 'RATING' ? ' active' : ''">평점순</a>

                    <a th:href="@{/search(keyword=${keyword}, sort='REVIEW', page=0)}"
                       th:classappend="${sort} == 'REVIEW' ? ' active' : ''">리뷰순</a>
                </div>
                <div class="view-options">
                    검색 결과
                </div>
            </div>

            <div class="book-grid">
                <!-- 검색 결과 없음 -->
                <div th:if="${books == null || #lists.isEmpty(books)}">
                    검색 결과가 없습니다.
                </div>

                <!-- 도서 카드 -->
                <article class="book-card"
                         th:each="book : ${books}">
                    <div class="book-cover">
                        <img th:if="${book.image != null}"
                             th:src="${book.image}"
                             alt="도서 표지" />
                        <span th:if="${book.image == null}">표지 이미지</span>
                    </div>

                    <h3 class="book-title" th:text="${book.title}">도서 제목</h3>

                    <p class="book-author">
                        <span th:text="${book.author}">저자</span>
                        <span th:if="${book.publisher != null}"
                              th:text="' · ' + ${book.publisher}"> · 출판사</span>
                    </p>

                    <div class="book-price-row">
                        <span class="amount"
                              th:text="${book.price != null ? #numbers.formatInteger(book.price, 3, 'COMMA') : '-'}">
                            0
                        </span>
                        <span class="won">원</span>
                    </div>

                    <div class="rating-row" th:if="${book.avgRating != null}">
                        <span th:text="${#numbers.formatDecimal(book.avgRating, 1, 1)}">4.5</span> 점
                        (<span th:text="${book.reviewCount}">0</span>건)
                    </div>
                </article>
            </div>
        </section>
    </div>
</main>
</body>
</html>
