<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:if="${myReview != null}" class="my-review-card">
    <div class="review-header">
        <span class="badge-my">내 리뷰</span>
        <span class="review-date" th:text="${#temporals.format(myReview.createdAt, 'yyyy.MM.dd')}"></span>
    </div>

    <div class="review-rating">
        <span th:text="${'★ ' + myReview.rating}" style="color: gold; font-weight: bold;"></span>
    </div>

    <div class="review-body" th:text="${myReview.content}">
        내용...
    </div>

    <div class="review-actions">
        <button class="btn-sm" th:onclick="'openEditForm(' + ${myReview.rating} + ', \'' + ${myReview.content} + '\')'">수정</button>
        <button class="btn-sm btn-danger" th:onclick="'deleteReview(' + ${myReview.reviewId} + ')'">삭제</button>
    </div>
</div>

<div th:if="${myReview == null}" class="no-review-box">
    <p>구매하신 책인가요? 리뷰를 남겨주세요!</p>
    <button class="btn-primary" onclick="openWriteForm()">리뷰 작성하기</button>
</div>
</body>
</html>
