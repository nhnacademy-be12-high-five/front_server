<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${book.title} + ' | HIGH-FIVE BOOKS'">도서 상세</title>

    <link rel="stylesheet" th:href="@{/book-css/detail-style.css}" />
</head>
<body>
<!-- =================== 헤더 =================== -->
<header id="header" role="banner">
    <div class="container">
        <a th:href="@{/}" class="logo">
            <img th:src="@{/img/logo.png}" alt="HIGH-FIVE 로고" width="100" height="100" />
            <div class="brand">HIGH-FIVE BOOKS</div>
        </a>

        <nav class="gnb" aria-label="주요 메뉴">
            <form class="search-box"
                  role="search"
                  th:action="@{/search}"
                  method="get">
                <input type="search"
                       name="keyword"
                       placeholder="도서명, 저자, ISBN, 태그 검색"
                       aria-label="통합 검색" />
                <input type="hidden" name="sort" value="POPULAR" />
                <button type="submit" class="search-btn">검색</button>
                <button type="submit"
                        class="search-btn ai"
                        th:formaction="@{/search/ai}">
                    AI 검색
                </button>
            </form>
        </nav>

        <div class="user-menu">
            <a class="user-link" th:href="@{/coupon}">
                <img th:src="@{/img/icon-coupon.png}" alt="쿠폰" class="user-icon" />
            </a>
            <a class="user-link" th:href="@{/mypage}">
                <img th:src="@{/img/icon-mypage.png}" alt="마이페이지" class="user-icon" />
            </a>
            <a class="user-link" th:href="@{/cart}">
                <img th:src="@{/img/icon-cart.png}" alt="장바구니" class="user-icon" />
            </a>
            <a class="user-link pill" th:href="@{/member/login.html}">로그인</a>
        </div>
    </div>
</header>

<!-- =================== 메인 =================== -->
<main id="container">
    <div class="container">
        <!-- 브레드크럼 -->
        <div class="breadcrumb">
            <span>홈</span>
            <span>도서 상세</span>
            <span th:text="${book.title}">도서 제목</span>
        </div>

        <section class="book-detail">
            <div class="book-detail-main">
                <!-- 표지 -->
                <div class="book-detail-cover">
                    <img th:if="${book.image != null}"
                         th:src="${book.image}"
                         alt="도서 표지" />
                    <div th:if="${book.image == null}" class="no-cover">
                        도서 이미지
                    </div>
                </div>

                <!-- 주요 정보 -->
                <div class="book-detail-info">
                    <h1 class="book-detail-title" th:text="${book.title}">
                        도서 제목
                    </h1>

                    <p class="book-detail-meta">
                        <span th:text="${book.author}">저자</span>
                        <span th:if="${book.publisher != null}"
                              th:text="' · ' + ${book.publisher}">
                            · 출판사
                        </span>
                        <span th:if="${book.publishedDate != null}"
                              th:text="' · ' + ${book.publishedDate}">
                            · 발행일
                        </span>
                        <span th:if="${book.isbn != null}"
                              th:text="' · ISBN ' + ${book.isbn}">
                            · ISBN
                        </span>
                    </p>

                    <!-- 가격 -->
                    <div class="book-detail-price-row">
                        <div class="price-main">
                            <span class="amount"
                                  th:text="${#numbers.formatInteger(book.price, 3, 'COMMA')}">
                                0
                            </span>
                            <span class="won">원</span>
                        </div>
                    </div>

                    <!-- 평점/리뷰 -->
                    <div class="book-detail-rating" th:if="${book.avgRating != null}">
                        <span class="rating-score"
                              th:text="${#numbers.formatDecimal(book.avgRating, 1, 1)}">
                            0.0
                        </span>
                        점 (
                        <span th:text="${book.reviewCount}">0</span>건의 리뷰
                        )
                    </div>

                    <!-- 장바구니/구매 버튼 -->
                    <div class="book-detail-actions">
                        <a class="btn primary"
                           th:href="@{/cart/add(bookId=${book.id})}">
                            장바구니 담기
                        </a>
                        <a class="btn secondary"
                           th:href="@{/order/now(bookId=${book.id})}">
                            바로 구매
                        </a>
                    </div>
                </div>
            </div>

            <!-- 상세 설명 -->
            <section class="book-detail-section">
                <h2>도서 소개</h2>
                <p th:text="${book.content}">
                    도서 소개 내용이 표시됩니다.
                </p>
            </section>

            <!-- 태그 -->
            <section class="book-detail-section" th:if="${book.tags != null}">
                <h2>태그</h2>
                <div class="tag-list">
                    <span class="tag"
                          th:each="tag : ${book.tags}"
                          th:text="'#' + ${tag}">
                        #태그
                    </span>
                </div>
            </section>

            <!-- 리뷰 -->
            <section class="book-detail-section">
                <h2>리뷰</h2>
                <p>리뷰 기능은 추후 연동 예정입니다.</p>
            </section>
        </section>
    </div>
</main>
</body>
</html>
