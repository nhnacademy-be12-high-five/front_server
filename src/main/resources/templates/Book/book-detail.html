<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${book.title} + ' | HIGH-FIVE BOOKS'">도서 상세</title>
    <link rel="stylesheet" th:href="@{/book-css/review-section.css}">
    <link rel="stylesheet" href="/book-css/detail-style.css">
</head>
<body>
<header id="header" role="banner">
    <div class="container">
        <a th:href="@{/}" class="logo">
            <img th:src="@{/img/logo.png}" alt="HIGH-FIVE 로고" width="100" height="100" />
            <div class="brand">HIGH-FIVE BOOKS</div>
        </a>
        <nav class="gnb" aria-label="주요 메뉴">
            <form class="search-box" role="search" th:action="@{/search}" method="get">
                <input type="search" name="keyword" placeholder="도서명, 저자, ISBN, 태그 검색" />
                <input type="hidden" name="sort" value="POPULAR" />
                <button type="submit" class="search-btn">검색</button>
                <button type="submit" class="search-btn ai" th:formaction="@{/rag-search}">AI 검색</button>
            </form>
        </nav>
        <div class="user-menu">
            <a class="user-link" th:href="@{/coupon}"><img th:src="@{/img/icon-coupon.png}" alt="쿠폰" class="user-icon" /></a>
            <a class="user-link" th:href="@{/mypage}"><img th:src="@{/img/icon-mypage.png}" alt="마이페이지" class="user-icon" /></a>
            <a th:href="@{/cart}" class="user-link cart-link-wrap">
                <img th:src="@{/img/icon-cart.png}" alt="장바구니" class="user-icon" />
                <span id="cartBadge" class="cart-badge" style="display: none;">0</span>
            </a>
            <a class="user-link pill" th:href="@{/member/login.html}">로그인</a>
        </div>
    </div>
</header>

<main id="container">
    <div class="container2">
        <div class="breadcrumb">
            <span>홈</span>
            <span>도서 상세</span>
            <span th:text="${book.title}">도서 제목</span>
        </div>

        <section class="book-detail">
            <div class="book-detail-main">
                <div class="book-image">
                    <img th:if="${book.image != null}" th:src="${book.image}" alt="도서 표지" />
                    <div th:if="${book.image == null}" class="no-cover">도서 이미지</div>
                </div>

                <div class="book-info">
                    <h1 th:text="${book.title}">도서 제목</h1>
                    <p class="author-publisher">
                        <span th:text="${book.author}">저자</span>
                        <span th:if="${book.publisher != null}" th:text="' · ' + ${book.publisher}">· 출판사</span>
                        <span th:if="${book.publishedDate != null}" th:text="' · ' + ${book.publishedDate}">· 발행일</span>
                        <span th:if="${book.isbn != null}" th:text="' · ISBN ' + ${book.isbn}">· ISBN</span>
                    </p>

                    <div class="price-section" th:if="${book.price != null}">
                        <div class="original-price">
                            <span th:text="${#numbers.formatInteger(book.price * 110 / 100, 3, 'COMMA')}">0</span>원
                        </div>
                        <div class="discount-price">
                            <span class="discount-rate">10%</span>
                            <span class="final-price" th:text="${#numbers.formatInteger(book.price, 3, 'COMMA')}">0</span>
                            <span class="currency">원</span>
                        </div>
                        <div class="point-info">
                            적립 <span th:text="${#numbers.formatInteger(book.price / 100, 1, 'COMMA')}">0</span> P
                        </div>
                    </div>

                    <div class="option-block">
                        <div class="option-block-title">포장 선택</div>
                        <div class="option-items">
                            <button type="button" class="option-item active">포장 안함 <small>기본</small></button>
                            <button type="button" class="option-item">선물 포장 <small>추가 요금 발생 가능</small></button>
                        </div>
                    </div>

                    <div class="purchase-actions">
                        <button type="button" class="btn-heart" aria-label="관심도서">&#9829;</button>
                        <button type="button" class="btn-primary" id="add-to-cart-btn" th:data-book-id="${book.id}">장바구니 담기</button>
                        <a class="btn-secondary" th:href="@{/order/now(bookId=${book.id})}">바로 구매</a>
                    </div>

                    <table class="summary-table">
                        <tbody>
                        <tr th:if="${book.publisher != null}">
                            <th>출판사</th><td th:text="${book.publisher}"></td>
                        </tr>
                        <tr th:if="${book.publishedDate != null}">
                            <th>발행일</th><td th:text="${book.publishedDate}"></td>
                        </tr>
                        <tr th:if="${book.isbn != null}">
                            <th>ISBN</th><td th:text="${book.isbn}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="book-detail-tabs">
                <button type="button" class="active" data-target="tab-intro">도서 소개</button>
                <button type="button" data-target="tab-contents">목차</button>
                <button type="button" data-target="tab-review">리뷰 (<span th:text="${reviewList != null ? reviewList.totalElements : 0}">0</span>)</button>
                <button type="button" data-target="tab-qna">Q&amp;A</button>
                <button type="button" data-target="tab-shipping">배송/반품</button>
            </div>

            <div id="tab-intro" class="detail-tab-content">
                <h2>도서 소개</h2>
                <p th:text="${book.content}" style="line-height: 1.8; color: #555;">
                    도서 소개 내용
                </p>
            </div>

            <div id="tab-contents" class="detail-tab-content">
                <h2>목차</h2>
                <p>목차 정보는 추후 연동 예정입니다.</p>
            </div>

            <div id="tab-review" class="detail-tab-content">
                <h2>리뷰</h2>
                <div th:replace="~{/Book/review/review-section :: review-section}"></div>
            </div>

            <div id="tab-qna" class="detail-tab-content">
                <h2>Q&amp;A</h2>
                <p>상품 문의 기능은 추후 연동 예정입니다.</p>
            </div>

            <div id="tab-shipping" class="detail-tab-content">
                <h2>배송/반품 정보</h2>
                <div style="background:#f8f8f8; padding:20px; border-radius:8px;">
                    <p><strong>배송 안내</strong><br>도서 산간 지역은 추가 배송비가 발생할 수 있습니다.</p>
                    <br>
                    <p><strong>반품/교환 안내</strong><br>상품 수령 후 7일 이내 교환/반품 가능합니다.</p>
                </div>
            </div>

        </section>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const tabButtons = document.querySelectorAll('.book-detail-tabs button');
        const sections = document.querySelectorAll('.detail-tab-content');
        const navBar = document.querySelector('.book-detail-tabs');

        // 1. 버튼 클릭 시 해당 위치로 스크롤 이동 (Smooth Scroll)
        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.dataset.target;
                const targetSection = document.getElementById(targetId);

                if (targetSection) {
                    // 네비게이션 바 높이만큼 빼고 이동해야 제목이 안 가려짐
                    const navHeight = navBar.offsetHeight;
                    const targetPosition = targetSection.offsetTop - navHeight;

                    window.scrollTo({
                        top: targetPosition,
                        behavior: 'smooth'
                    });
                }
            });
        });

        // 2. 스크롤 시 현재 보고 있는 섹션 버튼 활성화 (Scroll Spy)
        window.addEventListener('scroll', () => {
            let current = '';
            const navHeight = navBar.offsetHeight + 50; // 여유값

            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.clientHeight;

                // 현재 스크롤 위치가 섹션 범위 안에 들어왔는지 확인
                if (scrollY >= (sectionTop - navHeight)) {
                    current = section.getAttribute('id');
                }
            });

            tabButtons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.target === current) {
                    btn.classList.add('active');
                }
            });
        });
    });
    document.addEventListener("DOMContentLoaded", function () {

        const addToCartBtn = document.getElementById("add-to-cart-btn");

        addToCartBtn.addEventListener("click", async () => {

            const bookId = addToCartBtn.getAttribute("data-book-id");

            // 요청 Body 구성
            const requestBody = {
                bookId: Number(bookId),
                quantity: 1
            };

            try {
                const response = await fetch("/cart/items", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        alert("로그인이 필요합니다.");
                        window.location.href = "/member/login.html";
                        return;
                    }
                    throw new Error("장바구니 추가 실패");
                }

                if (confirm("장바구니에 상품이 담겼습니다.\n장바구니로 이동하시겠습니까?")) {
                    window.location.href = "/cart";
                }

            } catch (error) {
                console.error(error);
                alert("장바구니 담기 중 오류가 발생했습니다.");
            }
        });
    });
    // [추가됨] 페이지 로드 시 뱃지 업데이트 + 뒤로가기 대응
    document.addEventListener("DOMContentLoaded", () => {
        updateCartBadge();
    });

    window.addEventListener("pageshow", (event) => {
        if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
            updateCartBadge();
        }
    });

    // ==========================================
    // [추가됨] 뱃지 카운트 로직 (서버 API 호출)
    // ==========================================
    function updateCartBadge() {
        fetch('/cart/count', {
            method: 'GET',
            headers: {'Content-Type': 'application/json'}
        })
            .then(res => {
                if (res.ok) return res.json();
                throw new Error('fail');
            })
            .then(count => {
                const badge = document.getElementById('cartBadge');
                if (badge) {
                    badge.textContent = count || 0;
                    badge.style.display = 'block'; // 0이어도 무조건 표시
                }
            })
            .catch(err => {
                console.error(err);
                const badge = document.getElementById('cartBadge');
                if (badge) {
                    badge.textContent = 0;
                    badge.style.display = 'block';
                }
            });
    }
</script>
</body>
</html>
