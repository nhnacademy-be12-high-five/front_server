<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highfive 관리자 - 결제/매출 통계</title>

    <!-- 공통 + 페이지별 -->
    <link rel="stylesheet" href="/css/admin-css/admin-common.css">
    <link rel="stylesheet" href="/css/admin-css/payment-stats.css">
    <link rel="stylesheet" href="/css/admin-css/admin-layout-fix.css">


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">
        window.CHART_DATA = {
            dailyStats: [[${dailyStats}]]
        };
    </script>
</head>

<body>
<div class="admin-shell">

    <header class="admin-topbar">
        <div class="admin-topbar__title">
            <h1>결제 및 매출 통계</h1>
            <p>기간별 매출/결제 추이를 확인합니다.</p>
        </div>
        <div class="admin-topbar__actions">
            <a class="btn btn-outline" href="/admin">관리자 홈</a>
        </div>
    </header>

    <main class="admin-content">
        <div class="stats-summary-grid">
            <div class="stat-card blue">
                <h3>총 매출액</h3>
                <p class="stat-value"
                   th:text="${#numbers.formatInteger(summary.totalSalesAmount, 0, 'COMMA')} + '원'">0원</p>
                <p class="stat-desc">누적 결제 금액</p>
            </div>

            <div class="stat-card green">
                <h3>순 매출액</h3>
                <p class="stat-value"
                   th:text="${#numbers.formatInteger(summary.netSalesAmount, 0, 'COMMA')} + '원'">0원</p>
                <p class="stat-desc">총 매출 - 환불 금액</p>
            </div>

            <div class="stat-card red">
                <h3>환불 금액</h3>
                <p class="stat-value"
                   th:text="${#numbers.formatInteger(summary.totalCancelAmount, 0, 'COMMA')} + '원'">0원</p>
                <div class="stat-sub">
                    <span>취소 건수: </span><strong th:text="${summary.cancelCount}">0</strong>건
                </div>
            </div>

            <div class="stat-card yellow">
                <h3>결제 성공률</h3>
                <p class="stat-value">
                    <span th:if="${summary.totalTransactionCount > 0}"
                          th:text="${#numbers.formatDecimal((summary.successCount * 100.0) / summary.totalTransactionCount, 1, 1)} + '%'">0.0%</span>
                    <span th:unless="${summary.totalTransactionCount > 0}">0%</span>
                </p>
                <p class="stat-desc">총 <span th:text="${summary.totalTransactionCount}">0</span>건 중 성공</p>
            </div>
        </div>

        <div class="chart-header-row">
            <h3>기간별 통계 상세</h3>
            <form method="get" action="/admin/payments/stats" class="date-filter">
                <input type="date" name="startDate" th:value="${startDate}">
                <span>~</span>
                <input type="date" name="endDate" th:value="${endDate}">
                <button type="submit">조회</button>
            </form>
        </div>

        <div class="charts-grid">
            <div class="chart-box card">
                <h4>일별 매출액 추이</h4>
                <div class="canvas-wrapper">
                    <canvas id="amountChart"></canvas>
                </div>
            </div>

            <div class="chart-box card">
                <h4>일별 결제 건수</h4>
                <div class="canvas-wrapper">
                    <canvas id="countChart"></canvas>
                </div>
            </div>
        </div>
    </main>

</div>

<!-- DOM 로딩 안정성 위해 body 끝으로 이동 -->
<script src="/js/admin/admin-payment-stats.js"></script>
</body>
</html>
