<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highfive 관리자 - 결제 수단 관리</title>
    <link rel="stylesheet" href="/css/admin-css/admin-point.css">

</head>

<body>
<aside class="sidebar">
    <h2>HIGHFIVE 관리자</h2>
    <ul class="menu">
        <li><a href="/admin/books">도서 관리</a></li>
        <li><a href="/admin/points">포인트 관리</a></li>
        <li><a href="/admin/coupons/page">쿠폰 관리</a></li>
        <li><a href="/admin/coupons/specific-book-coupons">특정 도서 쿠폰 관리</a></li>
        <li><a href="/admin/payments/stats">매출 통계</a></li>
        <li><a href="/admin/payments" data-key="payments" class="active">결제 수단 관리</a></li>
    </ul>
</aside>

<div style="flex:1; display:flex; flex-direction:column;">
    <header>결제 수단 관리</header>
    <main>
        <div class="card">
            <h3>결제 수단 ON/OFF 설정</h3>

            <div th:if="${message}" style="color: green; margin-bottom: 10px;" th:text="${message}"></div>
            <div th:if="${errorMessage}" style="color: red; margin-bottom: 10px;" th:text="${errorMessage}"></div>

            <table class="method-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>결제 수단 코드</th>
                    <th>표시 이름 (Alias)</th>
                    <th>현재 상태</th>
                    <th>상태 변경</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="method : ${methods}">
                    <td th:text="${method.id}">1</td>
                    <td th:text="${method.name}">TOSS</td>
                    <td th:text="${method.alias}">토스페이먼츠</td>
                    <td>
                        <span th:if="${method.active}" class="badge badge-on">활성 (ON)</span>
                        <span th:unless="${method.active}" class="badge badge-off">비활성 (OFF)</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/payments/{id}/status(id=${method.id})}" method="post">
                            <input type="hidden" name="isActive" th:value="${!method.active}" />

                            <button type="submit" class="save-btn"
                                    style="width: auto; margin: 0; padding: 6px 12px; font-size: 13px;"
                                    th:styleappend="${method.active} ? 'background-color:#dc3545;' : 'background-color:#28a745;'">
                                <span th:text="${method.active} ? '비활성화하기' : '활성화하기'">변경</span>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script src="/assets/admin.js"></script>
</body>
</html>
