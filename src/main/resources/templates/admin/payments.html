<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highfive 관리자 - 결제 수단 관리</title>

    <!-- 공통 + 기존 페이지 CSS -->
    <link rel="stylesheet" href="/css/admin-css/admin-common.css">
    <link rel="stylesheet" href="/css/admin-css/admin-point.css">
    <link rel="stylesheet" href="/css/admin-css/admin-layout-fix.css">

</head>

<body>
<div class="admin-shell">

    <header class="admin-topbar">
        <div class="admin-topbar__title">
            <h1>결제 수단 관리</h1>
            <p>결제 수단의 활성/비활성 상태를 설정합니다.</p>
        </div>
        <div class="admin-topbar__actions">
            <a class="btn btn-outline" href="/admin">관리자 홈</a>
        </div>
    </header>

    <main class="admin-content">
        <div class="card">
            <h3>결제 수단 ON/OFF 설정</h3>

            <div th:if="${message}" class="admin-alert admin-alert--success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="admin-alert admin-alert--error" th:text="${errorMessage}"></div>

            <table class="method-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>결제 수단 코드</th>
                    <th>표시 이름 (Alias)</th>
                    <th>현재 상태</th>
                    <th>상태 변경</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="method : ${methods}">
                    <td th:text="${method.id}">1</td>
                    <td th:text="${method.name}">TOSS</td>
                    <td th:text="${method.alias}">토스페이먼츠</td>
                    <td>
                        <span th:if="${method.active}" class="badge badge-on">활성 (ON)</span>
                        <span th:unless="${method.active}" class="badge badge-off">비활성 (OFF)</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/payments/{id}/status(id=${method.id})}" method="post">
                            <input type="hidden" name="isActive" th:value="${!method.active}" />

                            <button type="submit" class="save-btn"
                                    style="width: auto; margin: 0; padding: 6px 12px; font-size: 13px;"
                                    th:styleappend="${method.active} ? 'background-color:#dc3545;' : 'background-color:#28a745;'">
                                <span th:text="${method.active} ? '비활성화하기' : '활성화하기'">변경</span>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

</div>
</body>
</html>
