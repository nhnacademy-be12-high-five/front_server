<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highfive 관리자 - 특정 도서 쿠폰 관리</title>

    <!-- 공통 + 기존 페이지 CSS -->
    <link rel="icon" href="/img/favicon.png">
    <link rel="stylesheet" href="/css/admin-css/admin-common.css">
    <link rel="stylesheet" href="/css/admin-css/admin-coupons.css">
    <link rel="stylesheet" href="/css/admin-css/admin-layout-fix.css">


    <!-- 기존: 페이지 메시지를 JS로 전달 -->
    <script th:inline="javascript">
        window.PAGE_ENV = {
            message: [[${message != null ? "'" + message + "'" : "null"}]],
        errorMessage: [[${errorMessage != null ? "'" + errorMessage + "'" : "null"}]]
        };
    </script>
</head>

<body>
<div class="admin-shell">

    <header class="admin-topbar">
        <div class="admin-topbar__title">
            <h1>특정 도서 쿠폰 정책 생성</h1>
            <p>정책 생성 후, 검색으로 도서를 선택하여 적용 도서 목록을 구성합니다.</p>
        </div>
        <div class="admin-topbar__actions">
            <a class="btn btn-outline" href="/admin">관리자 홈</a>
        </div>
    </header>

    <main class="admin-content">
        <!-- 원본은 JS로 alert 처리 가능하므로, 서버 메시지 카드도 추가로 보여주되 중복되어도 무방 -->
        <div th:if="${message}" class="admin-alert admin-alert--success" th:text="${message}"></div>
        <div th:if="${errorMessage}" class="admin-alert admin-alert--error" th:text="${errorMessage}"></div>

        <div class="card" style="max-width: 900px; margin: 0 auto; padding: 18px;">
            <form action="/admin/coupons/policies/create" method="post" onsubmit="return prepareSubmit()">
                <div class="form-row">
                    <label>정책 이름</label>
                    <input type="text" name="name" placeholder="예: 해리포터 시리즈 특별 할인" required>
                </div>

                <div class="form-row">
                    <label>할인 타입</label>
                    <select name="discountType">
                        <option value="FIXED">정액 할인 (원)</option>
                        <option value="PERCENTAGE">정률 할인 (%)</option>
                    </select>
                </div>

                <div class="form-row">
                    <label>할인 값</label>
                    <input type="number" name="discountValue" placeholder="숫자만 입력" required>
                </div>

                <div class="form-row">
                    <label>최소 주문 금액</label>
                    <input type="number" name="minOrderValue" value="0">
                </div>

                <div class="form-row">
                    <label>최대 할인 금액</label>
                    <input type="number" name="maxDiscountValue" value="0">
                </div>

                <div class="form-row" style="align-items: flex-start;">
                    <label>적용 도서 검색</label>
                    <div style="flex: 1;">
                        <div class="input-group">
                            <input type="text" id="bookKeyword" placeholder="도서명, 저자, ISBN 검색"
                                   onkeypress="if(event.keyCode==13){ searchBooks(); return false; }">
                            <button type="button" onclick="searchBooks()" style="background: var(--color-primary);">
                                검색
                            </button>
                        </div>

                        <div id="searchResultArea" class="search-result-list" style="display: none;"></div>
                    </div>
                </div>

                <div class="form-row">
                    <label>선택된 도서</label>
                    <div id="selectedBookList"
                         style="flex: 1; padding: 10px; background: #f9f9f9; border-radius: 10px; min-height: 50px; border: 1px solid #e5e7eb;">
                        <span style="color: #999; font-size: 13px;">검색 후 도서를 추가해주세요.</span>
                    </div>
                </div>

                <div class="form-row">
                    <label>쿠폰 용도</label>
                    <select name="comment">
                        <option value="EVENT">EVENT (이벤트)</option>
                        <option value="WELCOME">WELCOME (신규 가입)</option>
                        <option value="BIRTHDAY">BIRTHDAY (생일)</option>
                    </select>
                </div>

                <input type="hidden" name="targetBookIds" id="targetBookIds">

                <button type="submit" class="save-btn" style="border-radius: 12px;">
                    정책 생성
                </button>
            </form>
        </div>
    </main>
</div>

<!-- 기존 JS는 DOM 로딩 안정성 위해 body 끝으로 이동 -->
<script src="/js/admin/admin-coupons.js"></script>
</body>
</html>
