<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highfive 관리자 - 특정 도서 쿠폰 관리</title>
    <link rel="stylesheet" href="/admin-css/coupons.css">
    <style>
        /* 검색 결과 리스트 스타일 */
        .search-result-list {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; }
        .book-info { flex: 1; }
        .book-title { font-weight: bold; font-size: 14px; }
        .book-meta { font-size: 12px; color: #666; }

        /* 선택된 도서 태그 스타일 */
        .selected-book-tag {
            display: inline-flex;
            align-items: center;
            background: #e3f2fd;
            color: #007bff;
            padding: 5px 10px;
            border-radius: 20px;
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
        }
        .selected-book-tag button {
            background: none;
            border: none;
            color: #007bff;
            margin-left: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
<aside class="sidebar">
    <h2>HIGHFIVE 관리자</h2>
    <ul class="menu">
        <li><a href="/admin/books">도서 관리</a></li>
        <li><a href="/admin/points/policy">포인트 관리</a></li>
        <li><a href="/admin/coupons/page">쿠폰 관리</a></li>
        <li><a href="/admin/coupons/specific-book-coupons" class="active">특정 도서 쿠폰 관리</a></li>
    </ul>
</aside>

<div class="content-area">
    <header>
        <h1>특정 도서 쿠폰 정책 생성</h1>
    </header>

    <main>
        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <h3>도서별 쿠폰 정책 만들기</h3>

            <form action="/admin/coupons/policies/create" method="post" onsubmit="return prepareSubmit()">
                <div class="form-row">
                    <label>정책 이름</label>
                    <input type="text" name="name" placeholder="예: 해리포터 시리즈 특별 할인" required>
                </div>
                <div class="form-row">
                    <label>할인 타입</label>
                    <select name="discountType">
                        <option value="FIXED">정액 할인 (원)</option>
                        <option value="PERCENTAGE">정률 할인 (%)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>할인 값</label>
                    <input type="number" name="discountValue" placeholder="숫자만 입력" required>
                </div>
                <div class="form-row">
                    <label>최소 주문 금액</label>
                    <input type="number" name="minOrderValue" value="0">
                </div>
                <div class="form-row">
                    <label>최대 할인 금액</label>
                    <input type="number" name="maxDiscountValue" value="0">
                </div>

                <div class="form-row" style="align-items: flex-start;">
                    <label>적용 도서 검색</label>
                    <div style="flex: 1;">
                        <div class="input-group">
                            <input type="text" id="bookKeyword" placeholder="도서명, 저자, ISBN 검색"
                                   onkeypress="if(event.keyCode==13){ searchBooks(); return false; }">
                            <button type="button" onclick="searchBooks()" style="background: var(--color-primary);">검색</button>
                        </div>

                        <div id="searchResultArea" class="search-result-list" style="display: none;"></div>
                    </div>
                </div>

                <div class="form-row">
                    <label>선택된 도서</label>
                    <div id="selectedBookList" style="flex: 1; padding: 10px; background: #f9f9f9; border-radius: 6px; min-height: 50px;">
                        <span style="color: #999; font-size: 13px;">검색 후 도서를 추가해주세요.</span>
                    </div>
                </div>

                <div class="form-row">
                    <label>쿠폰 용도</label>
                    <select name="comment">
                        <option value="EVENT">EVENT (이벤트)</option>
                        <option value="WELCOME">WELCOME (신규 가입)</option>
                        <option value="BIRTHDAY">BIRTHDAY (생일)</option>
                    </select>
                </div>

                <input type="hidden" name="targetBookIds" id="targetBookIds">
                <button type="submit" class="save-btn">정책 생성</button>
            </form>
        </div>
    </main>
</div>

<script>
    // 선택된 도서 ID를 담을 Set (중복 방지)
    const selectedBookIds = new Set();

    // 1. 도서 검색 (AJAX)
    async function searchBooks() {
        const keyword = document.getElementById('bookKeyword').value;
        if (!keyword.trim()) {
            alert("검색어를 입력하세요.");
            return;
        }

        const resultArea = document.getElementById('searchResultArea');
        resultArea.style.display = 'block';
        resultArea.innerHTML = '<div style="padding:10px;">검색 중...</div>';

        try {
            // AdminController에 있는 API 호출
            const response = await fetch(`/admin/coupons/books/search?keyword=${encodeURIComponent(keyword)}`);
            const books = await response.json();

            resultArea.innerHTML = '';

            if (books.length === 0) {
                resultArea.innerHTML = '<div style="padding:10px;">검색 결과가 없습니다.</div>';
                return;
            }

            books.forEach(book => {
                const item = document.createElement('div');
                item.className = 'search-result-item';
                item.innerHTML = `
                    <img src="${book.image || '/img/no-image.png'}" alt="표지">
                    <div class="book-info">
                        <div class="book-title">${book.title}</div>
                        <div class="book-meta">${book.author} | ${book.price}원 | ISBN: ${book.isbn}</div>
                    </div>
                    <button type="button" onclick="addBook(${book.id}, '${book.title.replace(/'/g, "\\'")}')"
                            style="padding: 5px 10px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 4px;">
                        추가
                    </button>
                `;
                resultArea.appendChild(item);
            });

        } catch (error) {
            console.error(error);
            resultArea.innerHTML = '<div style="padding:10px; color:red;">검색 중 오류가 발생했습니다.</div>';
        }
    }

    // 2. 도서 추가
    function addBook(id, title) {
        if (selectedBookIds.has(id)) {
            alert("이미 추가된 도서입니다.");
            return;
        }

        selectedBookIds.add(id);
        renderSelectedBooks();
    }

    // 3. 도서 삭제
    function removeBook(id) {
        selectedBookIds.delete(id);
        renderSelectedBooks();
    }

    // 4. 선택 목록 렌더링
    function renderSelectedBooks() {
        const container = document.getElementById('selectedBookList');
        container.innerHTML = '';

        if (selectedBookIds.size === 0) {
            container.innerHTML = '<span style="color: #999; font-size: 13px;">검색 후 도서를 추가해주세요.</span>';
            return;
        }

        selectedBookIds.forEach(id => {
            // UI용 타이틀을 따로 저장하지 않았다면 ID만 보여주거나, Map을 사용해야 함.
            // 여기서는 간단히 구현하기 위해 DOM 요소를 새로 생성
            // (실제로는 id -> title 맵핑을 관리하는 것이 좋습니다)

            const tag = document.createElement('span');
            tag.className = 'selected-book-tag';
            tag.innerHTML = `도서 ID: ${id} <button type="button" onclick="removeBook(${id})">x</button>`;
            container.appendChild(tag);
        });
    }

    // 원래 addBook 함수를 조금 수정해서 title도 활용하려면 selectedBooks Map을 쓰는게 좋습니다.
    // 여기서는 간단하게 구현했습니다.

    // 5. 폼 제출 전 처리
    function prepareSubmit() {
        if (selectedBookIds.size === 0) {
            alert("최소 한 권 이상의 도서를 선택해야 합니다.");
            return false;
        }
        // Set을 콤마로 구분된 문자열로 변환하여 hidden input에 저장
        document.getElementById('targetBookIds').value = Array.from(selectedBookIds).join(',');
        return true;
    }
</script>

</body>
</html>
