<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highfive 관리자 - 도서 관리</title>
    <link rel="stylesheet" href="/admin-css/book-css.css">
</head>

<body>
<!-- 좌측 사이드바 -->
<aside class="sidebar">
    <h2>HIGHFIVE 관리자</h2>
    <ul class="menu">
        <li><a href="/admin/books" data-key="books" class="active">도서 관리</a></li>
        <li><a href="/admin/points" data-key="points">포인트 정책 관리</a></li>
        <li><a href="/admin/coupons" data-key="coupons">쿠폰 관리</a></li>
        <li><a href="/api/coupons/admin/specific-book-coupons">특정 도서 쿠폰 관리</a></li>
    </ul>
</aside>

<!-- 메인 콘텐츠 -->
<div style="flex:1; display:flex; flex-direction:column;">
    <header>도서 관리</header>
    <main>
        <div class="card">
            <h3>도서 등록 관리</h3>

            <div class="form-row">
                <label for="bookId">도서 고유번호 (ISBN)</label>
                <input id="bookId" name="bookId" type="text" placeholder="예: 100001" />
            </div>

            <div class="form-row">
                <label for="title">도서 제목</label>
                <input id="title" name="title" type="text" placeholder="예: 하이파이브 개발자 되기" />
            </div>

            <div class="form-row">
                <label for="author">저자</label>
                <input id="author" name="author" type="text" placeholder="예: 홍길동" />
            </div>

<!--            // action : 도서 등록하는 API 수정하기 -->
            <form method="post" action="http://localhost:8080/">
                <input type="submit" value="도서 등록" class="save-btn">
            </form>

            <div class="updated-info">최근 수정: 2025-11-10 (관리자 ID: 1)</div>
        </div>
    </main>
</div>
<script src="assets/admin.js"></script>

</body>
</html>
