<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highfive 관리자 - 도서 정보 수정</title>
    <link rel="stylesheet" href="/css/admin-css/admin-book.css">
</head>

<script src="/js/admin/admin-books.js"></script>

<body>
<aside class="sidebar">
    <h2>HIGHFIVE 관리자</h2>
    <ul class="menu">
        <li><a href="/admin/books" class="active">도서 관리</a></li>
        <li><a href="/admin/points" data-key="points">포인트 관리</a></li>
        <li><a href="/admin/coupons/page" data-key="coupons">쿠폰 관리</a></li>
        <li><a href="/admin/coupons/specific-book-coupons">특정 도서 쿠폰 관리</a></li>
        <li><a href="/admin/payments/stats">매출 통계</a></li>
        <li><a href="/admin/payments" data-key="payments">결제 수단 관리</a></li>
    </ul>
</aside>

<div style="flex:1; display:flex; flex-direction:column; padding: 20px; overflow-y: auto;">
    <header><h1>도서 정보 관리</h1></header>

    <main>
        <div th:if="${message}" style="color: green; margin-bottom: 10px; font-weight: bold;" th:text="${message}"></div>
        <div th:if="${errorMessage}" style="color: red; margin-bottom: 10px; font-weight: bold;" th:text="${errorMessage}"></div>

        <div class="search-container">
            <h3>도서 검색 및 선택</h3>
            <div class="input-group" style="display: flex; gap: 10px;">
                <input type="text" id="bookKeyword" placeholder="수정할 도서명, 저자, ISBN 검색"
                       style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"
                       onkeypress="if(event.keyCode==13){ searchBooks(); return false; }">
                <button type="button" onclick="searchBooks()" class="save-btn" style="background-color: #007bff; color: white;">검색</button>
            </div>
            <div id="searchResultArea" class="search-result-list"></div>
        </div>

        <div class="card">
            <div class="form-header">
                <h3 id="formTitle">신규 도서 등록</h3>
                <button type="button" onclick="resetForm()" style="padding: 5px 10px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">초기화 (신규 등록)</button>
            </div>

            <div style="background-color: #f3f4f6; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px dashed #6c757d;">
                <label style="font-weight: bold; display: block; margin-bottom: 8px; color: #495057;">🤖 AI 도서 정보 자동입력 (ISBN)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="aiIsbnInput" placeholder="ISBN 13자리를 입력하세요 (예: 97911...)"
                           style="flex: 1; padding: 10px; border: 1px solid #ced4da; border-radius: 4px;"
                           onkeypress="if(event.keyCode==13){ fetchBookInfoByAi(); return false; }">
                    <button type="button" id="aiSearchBtn" onclick="fetchBookInfoByAi()"
                            style="padding: 10px 20px; background-color: #6f42c1; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                        AI 가져오기
                    </button>
                </div>
                <p style="font-size: 12px; color: #6c757d; margin-top: 5px;">* Google Books 정보를 가져오고, Gemini가 상세 설명을 자동으로 생성합니다.</p>
            </div>

            <form id="bookForm" method="post" action="/admin/books">
                <input type="hidden" id="bookId" name="id">

                <div class="form-row">
                    <label for="isbn">ISBN</label>
                    <input id="isbn" name="isbn" type="text" placeholder="ISBN 13자리" required />
                </div>

                <div class="form-row">
                    <label for="title">도서 제목</label>
                    <input id="title" name="title" type="text" placeholder="도서 제목" required />
                </div>

                <div class="form-row">
                    <label for="author">저자</label>
                    <input id="author" name="authors" type="text" placeholder="저자 (여러 명일 경우 콤마로 구분)" required />
                </div>

                <div class="form-row">
                    <label for="publisher">출판사</label>
                    <input id="publisher" name="publisher" type="text" placeholder="출판사" />
                </div>

                <div class="form-row">
                    <label for="publishedDate">출판일</label>
                    <input id="publishedDate" name="publishedDate" type="date" />
                </div>

                <div class="form-row">
                    <label for="price">가격</label>
                    <input id="price" name="price" type="number" placeholder="가격" />
                </div>

                <div class="form-row">
                    <label for="image">이미지 URL</label>
                    <input id="image" name="image" type="text" placeholder="이미지 URL" onchange="previewImage(this.value)" />
                    <div style="margin-top: 10px;">
                        <img id="imgPreview" class="preview-img" style="display: none; max-width: 150px;">
                    </div>
                </div>

                <div class="form-row">
                    <label for="description">설명</label>
                    <textarea id="description" name="description" placeholder="도서 설명" rows="5" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </div>

                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <input type="submit" id="submitBtn" value="도서 등록" class="save-btn" style="flex: 1; padding: 12px; background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px;">

                    <button type="button" id="deleteBtn" onclick="deleteBook()" style="display: none; flex: 0 0 100px; padding: 12px; background-color: #dc3545; color: white; border: none; cursor: pointer; font-size: 16px;">삭제</button>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
