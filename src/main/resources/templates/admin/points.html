<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highfive 관리자 - 포인트 정책 관리</title>
    <style>
        :root {
            --color-primary: #007bff;
            --color-accent: #e9c46a;
            --color-bg: #f6f8fb;
            --color-dark: #333;
            --color-light: #fff;
            --color-border: #ddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            background-color: var(--color-bg);
            color: var(--color-dark);
            display: flex;
            min-height: 100vh;
        }

        /* 사이드바 */
        .sidebar {
            width: 220px;
            background-color: #1e1e2f;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding-top: 30px;
        }

        .sidebar h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 40px;
            font-weight: 800;
            color: var(--color-accent);
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 10px;
        }

        .menu a {
            display: block;
            padding: 12px 20px;
            color: #ccc;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .menu a:hover,
        .menu a.active {
            background-color: #2f2f45;
            color: var(--color-accent);
        }

        /* 메인 컨텐츠 */
        main {
            flex: 1;
            background: var(--color-bg);
            padding: 30px 50px;
        }

        header {
            background-color: var(--color-primary);
            color: #fff;
            padding: 16px 40px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 30px 40px;
            max-width: 700px;
            margin-top: 30px;
        }

        .card h3 {
            font-size: 20px;
            margin-bottom: 24px;
        }

        .form-row {
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-row label {
            flex: 1;
            color: #444;
            font-weight: 600;
        }

        .form-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            text-align: right;
        }

        .save-btn {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background-color: var(--color-primary);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .save-btn:hover {
            background-color: #0056b3;
        }

        .updated-info {
            margin-top: 12px;
            font-size: 13px;
            color: #888;
            text-align: right;
        }

        .alert-msg {
            text-align: center;
            margin-bottom: 15px;
            font-weight: 600;
            padding: 10px 0;
            border-radius: 6px;
        }
        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
<!-- 좌측 사이드바 -->

<aside class="sidebar">
    <h2>HIGHFIVE 관리자</h2>
    <ul class="menu">
        <li><a href="/admin/books" data-key="members">도서 관리</a></li>
        <li><a href="/admin/points/policy"  data-key="points">포인트 정책 관리</a></li>
        <li><a href="/admin/coupons" data-key="coupons">쿠폰 관리</a></li>
    </ul>
</aside>

<!-- 메인 콘텐츠 -->
<div style="flex:1; display:flex; flex-direction:column;">
    <header>포인트 정책 관리</header>
    <main>
        <div class="card">
            <h3>포인트 적립 정책 수정</h3>

            <div th:if="${message}" class="alert-msg alert-success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert-msg alert-error" th:text="${errorMessage}"></div>

            <form method="post" action="/api/admin/points/policy">

                <div class="form-row">
                    <label>회원가입 적립 P</label>
                    <input type="number" name="signupPoint" th:value="${policy.signupPoint ?: 0}">
                </div>
                <div class="form-row">
                    <label>일반 리뷰 적립 P</label>
                    <input type="number" name="reviewPoint" th:value="${policy.reviewPoint ?: 0}">
                </div>
                <div class="form-row">
                    <label>포토 리뷰 적립 P</label>
                    <input type="number" name="photoPoint" th:value="${policy.photoPoint ?: 0}">
                </div>

                <input type="submit" value="정책 저장하기" class="save-btn">
            </form>

        </div>

        <div class="card">
            <h3>포인트 수동 조정</h3>
            <form method="post" action="/api/admin/points/adjustment">
                <div class="form-row">
                    <label>회원 ID</label>
                    <input type="number" name="memberId" placeholder="회원번호 입력">
                </div>
                <div class="form-row">
                    <label>조정 금액 (+/-)</label>
                    <input type="number" name="amount" placeholder="예: 1000 or -500">
                </div>
                <div class="form-row">
                    <label>사유</label>
                    <input type="text" name="reason" placeholder="예: 배송 지연 보상" style="text-align: left;">
                </div>
                <input type="submit" value="포인트 조정 실행" class="save-btn" style="background-color: #e9c46a;">
            </form>
        </div>

    </main>
</div>
</body>
</html>
