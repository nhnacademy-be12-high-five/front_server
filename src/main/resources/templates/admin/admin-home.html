<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Highfive 관리자 - 바로가기</title>
    <link rel="icon" href="/img/favicon.png">
    <link rel="stylesheet" href="/css/admin-css/admin-common.css">
    <link rel="stylesheet" href="/css/admin-css/admin-home.css">
</head>
<body>

<div class="admin-shell">
    <header class="admin-topbar admin-topbar--home">
        <div class="admin-topbar__title">
            <h1>관리자 페이지 메뉴</h1>
            <p>관리할 기능을 선택하세요.</p>
        </div>
    </header>

    <main class="admin-content">
        <section class="admin-grid">
            <a class="admin-card" href="/admin/books">
                <div class="admin-card__icon">📘</div>
                <div class="admin-card__title">도서 관리</div>
                <div class="admin-card__desc">도서 등록/수정/검색 및 AI 입력</div>
            </a>

            <a class="admin-card" href="/admin/points">
                <div class="admin-card__icon">💰</div>
                <div class="admin-card__title">포인트 관리</div>
                <div class="admin-card__desc">정책 수정 및 수동 조정</div>
            </a>

            <a class="admin-card" href="/admin/coupons/page">
                <div class="admin-card__icon">🎟</div>
                <div class="admin-card__title">쿠폰 관리</div>
                <div class="admin-card__desc">쿠폰 목록/정책 관리</div>
            </a>

            <a class="admin-card" href="/admin/payments/stats">
                <div class="admin-card__icon">📊</div>
                <div class="admin-card__title">매출 통계</div>
                <div class="admin-card__desc">매출 지표 조회</div>
            </a>

            <a class="admin-card" href="/admin/coupons/specific-book-coupons">
                <div class="admin-card__icon">🏷</div>
                <div class="admin-card__title">특정 도서 쿠폰</div>
                <div class="admin-card__desc">도서별 쿠폰 연결 관리</div>
            </a>

            <a class="admin-card" href="/admin/payments">
                <div class="admin-card__icon">💳</div>
                <div class="admin-card__title">결제 수단 관리</div>
                <div class="admin-card__desc">결제수단 설정/관리</div>
            </a>

            <!-- 주문 관리 (추가) -->
            <a class="admin-card" href="/admin/orders">
                <div class="admin-card__icon">🧾</div>
                <div class="admin-card__title">주문 관리</div>
                <div class="admin-card__desc">주문 조회/상태 변경/상세 확인</div>
            </a>

        </section>
    </main>
</div>

</body>
</html>
