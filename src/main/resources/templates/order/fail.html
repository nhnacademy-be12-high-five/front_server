<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 실패</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; text-align: center; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div style="text-align: center;">
    <h1 style="color: red;">결제가 실패했습니다.</h1>

    <p style="font-weight: bold;" th:text="${message}">알 수 없는 오류</p>

    <p th:if="${code != null}" th:text="'에러 코드: ' + ${code}" style="color: gray; font-size: 0.9em;"></p>

    <br>
    <a href="/payment" class="btn">다시 시도하기</a>
</div>
</body>
</html>
