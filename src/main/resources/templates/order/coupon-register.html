<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booktown - 쿠폰 발급</title>

    <link rel="stylesheet" href="/css/order-css/coupon-register.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">
</head>

<body>
<script src="/js/common.js"></script>

<!-- message / errorMessage를 JS로 안전하게 주입 -->
<script th:inline="javascript">
    window.PAGE_MESSAGE = /*[[${message}]]*/ null;
    window.PAGE_ERROR_MESSAGE = /*[[${errorMessage}]]*/ null;
</script>
<script src="/js/coupon-register.js"></script>

<div th:replace="~{layout/header :: header}"></div>

<div class="register-page-container">
    <h1 class="page-title"> 쿠폰 발급 </h1>

<!--    <a class="user-link" href="/">-->
<!--        <img src="/img/logo.png" alt="메인페이지로 이동하기" class="user-icon" width="200" height="200"/>-->
<!--    </a>-->

    <div class="available-coupons">
        <h3>다운로드 가능한 쿠폰 목록</h3>

        <div class="available-coupon-grid">
            <!--  쿠폰이 있을 때만 카드 렌더 -->
            <div class="download-coupon-card"
                 th:each="template : ${templates}"
                 th:if="${templates != null && !#lists.isEmpty(templates)}">

                <div class="coupon-info-text">
                    <h4 th:text="${template.couponName}">쿠폰 이름</h4>
                    <p th:text="${template.description}">쿠폰 설명</p>
                </div>

                <form method="post" th:action="@{/coupon/issue}">
                    <input type="hidden" name="couponId" th:value="${template.id}">
                    <button class="btn-download" aria-label="쿠폰 다운로드">
                        <svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3v10m0 0l-4-4m4 4l4-4M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="2"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"/>
                        </svg>
                    </button>
                </form>
            </div>

            <!--  빈 문구는 templates 기준으로만 -->
            <div class="empty-coupon"
                 th:if="${templates == null || #lists.isEmpty(templates)}">
                발급 가능한 쿠폰이 없습니다.
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
