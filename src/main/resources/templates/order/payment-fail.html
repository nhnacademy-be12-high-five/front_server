<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>결제 실패</title>
    <link rel="stylesheet" href="/css/order-css/payment-result.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">
</head>

<script src="/js/common.js"></script>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main>
    <div class="fail-container">
        <div class="icon-fail">⚠️</div>
        <h1>결제에 실패했습니다.</h1>
        <p>요청하신 결제를 처리하는 도중 오류가 발생했습니다.</p>

        <div class="error-box">
            <p><strong>오류 코드:</strong> <span th:text="${code}">UNKNOWN</span></p>
            <p><strong>사유:</strong> <span th:text="${message}">알 수 없는 오류</span></p>
        </div>

        <div style="margin-top: 30px;">
            <button class="order-btn" onclick="history.back()" style="width: 200px;">이전 페이지로 돌아가기</button>
            <!-- <button class="order-btn" onclick="window.location.href='/payment?orderId=[[${orderId}]]'" style="width: 200px;">이전 페이지로 돌아가기</button> -->
            <br><br>
            <a href="/" style="color: #666; font-size: 14px;">메인으로 이동</a>
        </div>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
