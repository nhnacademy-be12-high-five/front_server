<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIGH-FIVE 도서 | 주문 완료</title>
    <link rel="stylesheet" href="/css/order-css/payment-result.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">
</head>

<script src="/js/common.js"></script>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main>
    <div class="container order-complete-wrapper">
        <section class="order-complete">
            <div class="order-complete-icon">
                <span>✔</span>
            </div>
            <h1 class="order-title">주문이 성공적으로 완료되었습니다!</h1>
            <p class="order-subtitle">이용해 주셔서 감사합니다.</p>

            <div class="order-meta">
                <div class="order-meta-row">
                    <strong>주문 번호</strong>
                    <span th:text="${orderId}">001</span>
                </div>
                <div class="order-meta-row">
                    <strong>결제 금액</strong>
                    <span th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA') + '원'}">50,000원</span>
                </div>
                <div class="order-meta-row">
                    <strong>승인 일시</strong>
                    <span th:text="${orderDateTime}">2025-01-01 12:00</span>
                </div>
                <div class="order-meta-row">
                    <strong>결제 수단</strong>
                    <span th:text="${payMethodName}">Toss Payments</span>
                </div>
            </div>

            <div class="order-notice">
                주문 상세 내역은 <strong>마이페이지 > 주문내역</strong>에서 확인하실 수 있습니다.
            </div>

            <div class="order-actions">
                <!--<a class="btn primary" th:href="@{/orders/{id}(id=${orderId})}">주문 상세보기</a> -->
                <a class="btn ghost" href="/">홈으로 돌아가기</a>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
