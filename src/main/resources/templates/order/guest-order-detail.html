<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비회원 주문 상세 - HIGH-FIVE</title>
    <link rel="stylesheet" href="/css/order-css/order-detail.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main>
    <div class="container">
        <h1 class="page-title">비회원 주문 상세</h1>

        <section class="order-detail-wrap">

            <div class="order-top">
                <div class="order-top-left">
                    <div class="num">
                        주문번호  <span th:text="${order.orderNumber}">ORD-001</span>
                    </div>
                    <div class="date">
                        주문일자 <span th:text="${order.orderDate}">2025-12-25</span>
                    </div>
                </div>
                <div class="order-top-right">
                    <span class="badge-status"
                          th:text="${order.statusName}"
                          style="background-color: #333; color: #fff; padding: 4px 8px; border-radius: 4px;">
                        주문완료
                    </span>
                </div>
            </div>

            <div class="section-block">
                <div class="section-title-sm">주문 상품</div>
                <table class="order-items-table">
                    <thead>
                    <tr>
                        <th>상품 정보</th>
                        <th style="width:15%">수량</th>
                        <th style="width:20%">금액</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${order.orderItems}">
                        <td>
                            <div class="item-title" th:text="${item.title}">책 제목</div>
                            <div class="item-meta" th:if="${item.wrapperName != null}">
                                <span th:text="'🎁 포장: ' + ${item.wrapperName}">선물 포장</span>
                            </div>
                        </td>
                        <td class="qty" th:text="${item.quantity} + '개'">1개</td>
                        <td class="price" th:text="${#numbers.formatInteger(item.totalPrice, 0, 'COMMA')} + '원'">10,000원</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="section-block">
                <div class="info-grid">
                    <div class="info-card">
                        <div style="font-weight:700; margin-bottom:8px;">배송지 정보</div>
                        <div class="info-row">
                            <label>수령인</label>
                            <div th:text="${order.receiverName}">홍길동</div>
                        </div>
                        <div class="info-row">
                            <label>연락처</label>
                            <div th:text="${order.receiverPhone}">010-0000-0000</div>
                        </div>
                        <div class="info-row">
                            <label>주소</label>
                            <div>
                                <span th:text="${order.address}">서울시...</span>
                                <div class="addr-extra" th:text="${order.addressDetail}">상세주소</div>
                            </div>
                        </div>
                        <div class="info-row">
                            <label>요청사항</label>
                            <div th:text="${order.deliveryRequest}">없음</div>
                        </div>
                    </div>

                    <div class="info-card">
                        <div style="font-weight:700; margin-bottom:8px;">결제 정보</div>
                        <div class="pay-summary">
                            <div class="pay-row">
                                <span>상품금액</span>
                                <span th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + '원'">0원</span>
                            </div>
                            <div class="pay-row">
                                <span>배송비</span>
                                <span th:text="'+ ' + ${#numbers.formatInteger(order.deliveryFee, 0, 'COMMA')} + '원'">0원</span>
                            </div>
                            <div class="pay-row">
                                <span>할인금액</span>
                                <span th:with="discount=${(order.couponDiscount != null ? order.couponDiscount : 0) + (order.pointDiscount != null ? order.pointDiscount : 0)}"
                                      th:text="'- ' + ${#numbers.formatInteger(discount, 0, 'COMMA')} + '원'">
                                    - 0원
                                </span>
                            </div>
                            <div class="pay-row total">
                                <span>총 결제금액</span>
                                <span th:text="${#numbers.formatInteger(order.paymentAmount, 0, 'COMMA')} + '원'">0원</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="page-actions" style="margin-top: 30px; text-align: center;">
                <a href="/" class="btn btn-outline">홈으로 돌아가기</a>
            </div>

        </section>
    </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
