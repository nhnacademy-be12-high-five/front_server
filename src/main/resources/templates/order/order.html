<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문서 작성 - High Five</title>
    <link rel="stylesheet" href="/order-css/order.css">
    <style>
        /* 결제 수단 탭 스타일 통합 */
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .tab {
            flex: 1 1 120px;
            text-align: center;
            border: 1px solid #ddd;
            background: #fafafa;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab:hover { background: #f0f0f0; }
        .tab.active {
            border-color: #007bff;
            background: #eaf2ff;
            color: #007bff;
            font-weight: 700;
        }
        .tab.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #eee;
        }
        .pay-content {
            border: 1px dashed #ddd;
            border-radius: 8px;
            padding: 15px;
            color: #666;
            font-size: 13px;
            background: #fff;
        }
        /* 로딩 오버레이 */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://js.tosspayments.com/v1/payment"></script>
</head>
<body>

<div class="order-container"> <h2>주문서 작성</h2>

    <form id="orderForm" th:object="${checkoutRequest}" onsubmit="return false;">
        <input type="hidden" name="userId" th:value="${userId}">

        <section class="order-section">
            <h3>주문 상품</h3>
            <table class="order-table">
                <thead>
                <tr>
                    <th>상품 정보</th>
                    <th>수량</th>
                    <th>금액</th>
                    <th>포장 선택</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, stat : ${orderSheet.orderItems}">
                    <td>
                        <input type="hidden" th:name="|orderItems[${stat.index}].bookId|" th:value="${item.bookId}">
                        <img th:src="${item.imageUrl}" alt="책 이미지" width="50" style="vertical-align: middle; margin-right: 10px;">
                        <span th:text="${item.title}">책 제목</span>
                    </td>
                    <td>
                        <input type="hidden" th:name="|orderItems[${stat.index}].quantity|" th:value="${item.quantity}" class="item-qty">
                        <span th:text="${item.quantity}">1</span>개
                    </td>
                    <td>
                        <span th:text="${#numbers.formatInteger(item.totalPrice, 0, 'COMMA')}">10,000</span>원
                    </td>
                    <td>
                        <select th:name="|orderItems[${stat.index}].wrapperId|" class="wrapper-select" onchange="updateTotal()">
                            <option value="" data-price="0">선택 안함</option>
                            <option th:each="wrapper : ${orderSheet.wrappers}"
                                    th:value="${wrapper.id}"
                                    th:data-price="${wrapper.price}"
                                    th:text="|${wrapper.name} (+${wrapper.price}원)|">
                                선물 포장 (+1000원)
                            </option>
                        </select>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="order-section">
            <h3>배송지 정보</h3>
            <div class="form-group">
                <label>받는 사람</label>
                <input type="text" th:field="*{receiverName}" id="receiverName" required>
            </div>
            <div class="form-group">
                <label>연락처</label>
                <input type="text" th:field="*{receiverPhone}" id="receiverPhone" placeholder="010-0000-0000" required>
            </div>
            <div class="form-group">
                <label>주소</label>
                <input type="text" th:field="*{receiverAddress}" id="receiverAddress" placeholder="상세 주소를 입력하세요" required>
            </div>
            <div class="form-group">
                <label>희망 배송일</label>
                <input type="date" th:field="*{requestDeliveryDate}">
            </div>
        </section>

        <section class="order-section">
            <h3>할인 / 결제</h3>
            <div class="discount-row">
                <label>쿠폰 사용</label>
                <select th:field="*{couponId}" id="couponSelect" onchange="updateTotal()">
                    <option value="" data-discount="0">사용 안함</option>
                    <option th:each="coupon : ${coupons}"
                            th:value="${coupon.id}"
                            th:data-discount="${coupon.discountValue}"
                            th:text="|${coupon.couponName} (${#numbers.formatInteger(coupon.discountValue, 0, 'COMMA')}원 할인)|">
                        쿠폰명
                    </option>
                </select>
            </div>
            <div class="discount-row">
                <label>포인트 사용 (보유: <span th:text="${#numbers.formatInteger(point, 0, 'COMMA')}">0</span>P)</label>
                <input type="number" th:field="*{usedPoint}" id="usedPoint" value="0" min="0"
                       th:max="${point}"
                       onchange="updateTotal()"> P
                <button type="button" onclick="useAllPoints()" style="margin-left: 10px; padding: 5px 10px; cursor: pointer;">전액 사용</button>
            </div>

            <div class="form-group" th:if="${orderSheet.myPoint == null || orderSheet.myPoint == 0}">
                <label>주문 비밀번호 (비회원)</label>
                <input type="password" th:field="*{orderPassword}" placeholder="주문 조회용 비밀번호 입력">
            </div>
        </section>

        <section class="order-section">
            <h3>결제 수단 선택</h3>

            <input type="hidden" name="paymentMethod" id="paymentMethodInput">

            <div class="tabs">
                <div th:if="${#lists.isEmpty(paymentMethods)}" style="width:100%; color:red; padding:10px;">
                    사용 가능한 결제 수단이 없습니다. 관리자에게 문의하세요.
                </div>

                <button th:each="method : ${paymentMethods}"
                        type="button"
                        class="tab"
                        th:data-code="${method.name}"
                        onclick="selectMethod(this)"
                        th:classappend="${!method.active} ? ' disabled' : ''"
                        th:disabled="${!method.active}">
                    <span th:text="${method.alias}">신용카드</span>
                </button>
            </div>

            <div class="pay-content">
                <p id="method-desc">결제 수단을 선택해주세요.</p>
            </div>
        </section>

        <section class="payment-summary">
            <h3>최종 결제 금액</h3>
            <div class="summary-row">
                <span>총 상품 금액</span>
                <span class="amount">
                    <span th:text="${#numbers.formatInteger(orderSheet.totalProductPrice, 0, 'COMMA')}">0</span>원
                </span>
            </div>
            <div class="summary-row">
                <span>배송비</span>
                <span class="amount">
                    <span id="displayDeliveryFee" th:text="${orderSheet.deliveryFee}">0</span>원
                </span>
            </div>
            <div class="summary-row">
                <span>포장비</span>
                <span class="amount">
                    <span id="displayWrappingFee">0</span>원
                </span>
            </div>
            <div class="summary-row discount">
                <span>할인 금액</span>
                <span class="amount">-<span id="displayDiscount">0</span>원</span>
            </div>
            <hr>
            <div class="total-row">
                <span>총 결제 금액</span>
                <span class="amount final-price">
                    <span id="displayFinalPrice">0</span>원
                </span>
            </div>
        </section>

        <button type="button" class="btn-submit" onclick="requestPayment()">결제하기</button>
    </form>
</div>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: bold;">결제 진행 중...</p>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    // 1. 서버 데이터
    const productPrice = /*[[${orderSheet.totalProductPrice}]]*/ 0;
    const initialDeliveryFee = /*[[${orderSheet.deliveryFee}]]*/ 0;
    const maxPoint = /*[[${point != null ? point : 0}]]*/ 0;
    const tossClientKey = /*[[${tossClientKey}]]*/ "";
    const customerEmail = /*[[${orderSheet.email}]]*/ "test@example.com";

    // 2. 토스 객체
    const tossPayments = TossPayments(tossClientKey);
    let selectedMethodCode = null; // 선택된 결제 수단 코드

    // 초기화
    $(document).ready(function() {
        updateTotal();

        // 첫 번째 활성화된 결제 수단 자동 선택
        const firstTab = $('.tab:not(.disabled)').first();
        if (firstTab.length > 0) {
            selectMethod(firstTab[0]);
        }
    });

    // ===========================
    // UI 로직 (금액, 결제수단)
    // ===========================
    function updateTotal() {
        // 포장비
        let wrappingFee = 0;
        $('.wrapper-select').each(function() {
            const price = parseInt($(this).find(':selected').data('price')) || 0;
            const qty = parseInt($(this).closest('tr').find('.item-qty').val()) || 1;
            wrappingFee += (price * qty);
        });

        // 할인
        const couponDiscount = parseInt($('#couponSelect').find(':selected').data('discount')) || 0;
        let usedPoint = parseInt($('#usedPoint').val()) || 0;

        if (usedPoint > maxPoint) {
            alert('보유 포인트를 초과할 수 없습니다.');
            usedPoint = maxPoint;
            $('#usedPoint').val(maxPoint);
        }
        if (usedPoint < 0) {
            usedPoint = 0;
            $('#usedPoint').val(0);
        }

        const totalDiscount = couponDiscount + usedPoint;
        let finalPrice = productPrice + initialDeliveryFee + wrappingFee - totalDiscount;
        if (finalPrice < 0) finalPrice = 0;

        // 화면 갱신
        $('#displayWrappingFee').text(wrappingFee.toLocaleString());
        $('#displayDiscount').text(totalDiscount.toLocaleString());
        $('#displayFinalPrice').text(finalPrice.toLocaleString());
    }

    function useAllPoints() {
        const input = document.getElementById('usedPoint');
        input.value = maxPoint; // maxPoint는 이미 script 상단에 정의됨
        updateTotal();
    }

    // 결제 수단 탭 선택 함수
    function selectMethod(element) {
        if (element.classList.contains("disabled")) return;

        // 스타일 변경
        $('.tab').removeClass('active');
        $(element).addClass('active');

        // 값 설정
        selectedMethodCode = element.getAttribute("data-code");
        $('#paymentMethodInput').val(selectedMethodCode);

        // 설명 문구 업데이트
        const desc = document.getElementById("method-desc");
        if (selectedMethodCode === 'TOSS') {
            desc.innerText = "Toss 위젯을 통해 빠르게 결제 해보세요.";
        } else if (selectedMethodCode === 'BANK_TRANSFER') {
            desc.innerText = "실시간 계좌이체를 진행합니다.";
        } else if (selectedMethodCode === 'VIRTUAL_ACCOUNT') {
            desc.innerText = "가상계좌를 발급받아 입금 후 결제 완료됩니다.";
        } else {
            desc.innerText = "선택한 결제 수단으로 진행합니다.";
        }
    }

    // ===========================
    // 핵심 결제 요청 로직
    // ===========================
    function requestPayment() {
        // 1. 유효성 검사
        if (!selectedMethodCode) {
            alert("결제 수단을 선택해주세요.");
            return;
        }

        const receiverName = $('#receiverName').val();
        const receiverPhone = $('#receiverPhone').val();
        const receiverAddress = $('#receiverAddress').val();

        if (!receiverName || !receiverPhone || !receiverAddress) {
            alert("배송지 정보를 모두 입력해주세요.");
            return;
        }

        // 2. 로딩 시작
        $('#loading-overlay').css('display', 'flex');

        // 3. 폼 데이터 준비
        const formData = new FormData(document.getElementById('orderForm'));

        // 4. 주문 생성 (AJAX)
        $.ajax({
            url: '/orders/api/create',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(response) {
                // 성공 시 서버로부터 받은 데이터
                const orderId = response.orderKey;
                const amount = response.totalAmount;
                const orderName = "HIGH-FIVE 도서 주문"; // 혹은 response.orderName

                // Toss 메서드 매핑
                const methodMap = {
                    "TOSS": "카드",
                    "BANK_TRANSFER": "계좌이체",
                    "VIRTUAL_ACCOUNT": "가상계좌"
                };
                const tossMethod = methodMap[selectedMethodCode] || "카드";

                // 5. 토스 결제창 호출
                tossPayments.requestPayment(tossMethod, {
                    amount: amount,
                    orderId: orderId,
                    orderName: orderName,
                    customerName: receiverName,
                    customerEmail: customerEmail,
                    successUrl: window.location.origin + "/orders/success",
                    failUrl: window.location.origin + "/orders/fail",
                }).catch(function (error) {
                    $('#loading-overlay').hide();
                    if (error.code !== 'USER_CANCEL') {
                        alert("결제 실패: " + error.message);
                    }
                });
            },
            error: function(xhr) {
                $('#loading-overlay').hide();
                let msg = "주문 생성 실패";
                if (xhr.responseText) msg += ": " + xhr.responseText;
                alert(msg);
            }
        });
    }
    /*]]>*/
</script>

</body>
</html>
