<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <title>주문서 작성 - High Five</title>
    <link rel="stylesheet" href="/order-css/order.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<!-- ✅ 기존 container -> order-container 로 변경 -->
<div class="order-container">
    <h2>주문서 작성</h2>

    <form th:action="@{/orders}" method="post" th:object="${checkoutRequest}" id="orderForm">

        <section class="order-section">
            <h3>주문 상품</h3>
            <table class="order-table">
                <thead>
                <tr>
                    <th>상품 정보</th>
                    <th>수량</th>
                    <th>금액</th>
                    <th>포장 선택</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, stat : ${orderSheet.orderItems}">
                    <td>
                        <input type="hidden" th:name="|orderItems[${stat.index}].bookId|" th:value="${item.bookId}">
                        <img th:src="${item.imageUrl}" alt="책 이미지" width="50">
                        <span th:text="${item.title}">책 제목</span>
                    </td>
                    <td>
                        <input type="hidden" th:name="|orderItems[${stat.index}].quantity|" th:value="${item.quantity}" class="item-qty">
                        <span th:text="${item.quantity}">1</span>개
                    </td>
                    <td>
                        <span th:text="${#numbers.formatInteger(item.totalPrice, 0, 'COMMA')}">10,000</span>원
                    </td>
                    <td>
                        <select th:name="|orderItems[${stat.index}].wrapperId|" class="wrapper-select" onchange="updateTotal()">
                            <option value="" data-price="0">선택 안함</option>
                            <option th:each="wrapper : ${orderSheet.wrappers}"
                                    th:value="${wrapper.id}"
                                    th:data-price="${wrapper.price}"
                                    th:text="|${wrapper.name} (+${wrapper.price}원)|">
                                선물 포장 (+1000원)
                            </option>
                        </select>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="order-section">
            <h3>배송지 정보</h3>
            <div class="form-group">
                <label>받는 사람</label>
                <input type="text" th:field="*{receiverName}" th:value="${orderSheet.name}" required>
            </div>
            <div class="form-group">
                <label>연락처</label>
                <input type="text" th:field="*{receiverPhone}" th:value="${orderSheet.phoneNumber}" placeholder="010-0000-0000" required>
            </div>
            <div class="form-group">
                <label>주소</label>
                <input type="text" th:field="*{receiverAddress}" placeholder="상세 주소를 입력하세요" required>
            </div>
            <div class="form-group">
                <label>희망 배송일</label>
                <input type="date" th:field="*{requestDeliveryDate}">
            </div>
        </section>

        <section class="order-section">
            <h3>할인 / 결제</h3>
            <div class="discount-row">
                <label>쿠폰 사용</label>
                <select th:field="*{couponId}" id="couponSelect" onchange="updateTotal()">
                    <option value="" data-discount="0">사용 안함</option>
                    <option th:each="coupon : ${orderSheet.coupons}"
                            th:value="${coupon.couponId}"
                            th:data-discount="${coupon.discountAmount}"
                            th:text="${coupon.couponName}">
                        신규 가입 쿠폰 (3000원)
                    </option>
                </select>
            </div>
            <div class="discount-row">
                <label>포인트 사용 (보유: <span th:text="${orderSheet.myPoint}">0</span>P)</label>
                <input type="number" th:field="*{usedPoint}" id="usedPoint" value="0" min="0"
                       th:max="${orderSheet.myPoint != null ? orderSheet.myPoint : 0}"
                       onchange="updateTotal()"> P
            </div>

            <div class="form-group" th:if="${orderSheet.myPoint == null || orderSheet.myPoint == 0}">
                <label>주문 비밀번호 (비회원)</label>
                <input type="password" th:field="*{orderPassword}" placeholder="주문 조회용 비밀번호 입력">
            </div>
        </section>

        <section class="payment-summary">
            <h3>최종 결제 금액</h3>

            <div class="summary-row">
                <span>총 상품 금액</span>
                <!-- ✅ 숫자+원 묶어서 오른쪽 정렬 가능 -->
                <span class="amount">
                    <span id="displayProductPrice"
                          th:text="${#numbers.formatInteger(orderSheet.totalProductPrice, 0, 'COMMA')}">0</span>원
                </span>
            </div>

            <div class="summary-row">
                <span>배송비</span>
                <span class="amount">
                    <span id="displayDeliveryFee" th:text="${orderSheet.deliveryFee}">0</span>원
                </span>
            </div>

            <div class="summary-row">
                <span>포장비</span>
                <span class="amount">
                    <span id="displayWrappingFee">0</span>원
                </span>
            </div>

            <div class="summary-row discount">
                <span>할인 금액</span>
                <span class="amount">-<span id="displayDiscount">0</span>원</span>
            </div>

            <hr>

            <div class="total-row">
                <span>총 결제 금액</span>
                <span class="amount final-price">
                    <span id="displayFinalPrice">0</span>원
                </span>
            </div>
        </section>

        <button type="submit" class="btn-submit">결제하기</button>
    </form>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const productPrice = [[${orderSheet.totalProductPrice}]];
    const initialDeliveryFee = [[${orderSheet.deliveryFee}]];
    const maxPoint = [[${orderSheet.myPoint != null ? orderSheet.myPoint : 0}]];
    /*]]>*/

    function updateTotal() {
        // 1. 포장비 계산
        let wrappingFee = 0;
        $('.wrapper-select').each(function() {
            const price = parseInt($(this).find(':selected').data('price')) || 0;
            const qty = parseInt($(this).closest('tr').find('.item-qty').val()) || 1;
            wrappingFee += (price * qty);
        });

        // 2. 할인 계산
        const couponDiscount = parseInt($('#couponSelect').find(':selected').data('discount')) || 0;

        let usedPoint = parseInt($('#usedPoint').val()) || 0;
        if (usedPoint > maxPoint) {
            alert('보유 포인트를 초과하여 사용할 수 없습니다.');
            usedPoint = maxPoint;
            $('#usedPoint').val(maxPoint);
        }
        if (usedPoint < 0) {
            usedPoint = 0;
            $('#usedPoint').val(0);
        }

        const totalDiscount = couponDiscount + usedPoint;

        // 3. 최종 금액 계산
        let finalPrice = productPrice + initialDeliveryFee + wrappingFee - totalDiscount;
        if (finalPrice < 0) finalPrice = 0;

        // 4. 화면 업데이트
        $('#displayWrappingFee').text(wrappingFee.toLocaleString());
        $('#displayDiscount').text(totalDiscount.toLocaleString());
        $('#displayFinalPrice').text(finalPrice.toLocaleString());
    }

    function updateCartBadge() {
        fetch('/cart/count', {
            method: 'GET',
            headers: {'Content-Type': 'application/json'}
        })
            .then(res => res.ok ? res.json() : 0)
            .then(count => {
                const badge = document.getElementById('cartBadge');
                if (badge) {
                    badge.textContent = count || 0;
                    badge.style.display = 'block';
                }
            })
            .catch(err => console.error("장바구니 카운트 로드 실패:", err));
    }

    $(document).ready(function() {
        updateTotal();
        updateCartBadge();
    });
</script>

</body>
</html>
