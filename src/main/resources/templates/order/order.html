<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문서 작성 - High Five</title>
    <link rel="stylesheet" href="/order-css/order.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <style>
        /* 비회원 기능 제한용 스타일 */
        .disabled-overlay {
            background-color: #eee;
            opacity: 0.6;
            pointer-events: none; /* 클릭 방지 */
            cursor: not-allowed;
        }
        .login-guide {
            font-size: 12px;
            color: #dc3545; /* 붉은색 경고 */
            margin-left: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="order-container">
    <h2>주문서 작성</h2>

    <form id="orderForm" th:object="${checkoutRequest}" onsubmit="return false;">
        <input type="hidden" name="userId" th:value="${userId}">

        <section class="order-section">
            <h3>주문 상품</h3>
            <table class="order-table">
                <thead>
                <tr>
                    <th>상품 정보</th>
                    <th>수량</th>
                    <th>금액</th>
                    <th>포장 선택</th>
                </tr>
                </thead>
                <tbody id="orderItemsBody">
                <tr th:each="item, stat : ${orderSheet.orderItems}" class="order-item-row">
                    <td>
                        <input type="hidden" th:name="|orderItems[${stat.index}].bookId|" th:value="${item.bookId}">
                        <input type="hidden" class="item-price" th:value="${item.price}">

                        <img th:src="${item.imageUrl}" alt="책 이미지" width="50" style="vertical-align: middle; margin-right: 10px;">
                        <span th:text="${item.title}">책 제목</span>
                    </td>
                    <td>
                        <input type="number"
                               th:name="|orderItems[${stat.index}].quantity|"
                               th:value="${item.quantity}"
                               class="item-qty-input"
                               min="1"
                               onchange="updateTotal()"
                               onkeyup="updateTotal()"> 개
                    </td>
                    <td>
                        <span class="item-total-price" th:text="${#numbers.formatInteger(item.totalPrice, 0, 'COMMA')}">10,000</span>원
                    </td>
                    <td>
                        <select th:name="|orderItems[${stat.index}].wrapperId|" class="wrapper-select" onchange="updateTotal()">
                            <option value="" data-price="0">선택 안함</option>
                            <option th:each="wrapper : ${orderSheet.wrappers}"
                                    th:value="${wrapper.id}"
                                    th:data-price="${wrapper.price}"
                                    th:text="|${wrapper.name} (+${wrapper.price}원)|">
                                선물 포장 (+1000원)
                            </option>
                        </select>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="order-section">
            <h3>배송지 정보</h3>
            <div class="form-group">
                <label>받는 사람</label>
                <input type="text" id="receiverName" name="receiverName"
                       th:value="${checkoutRequest.receiverName} ?: '홍길동'" required>
            </div>
            <div class="form-group">
                <label>연락처</label>
                <input type="text" id="receiverPhone" name="receiverPhone"
                       th:value="${checkoutRequest.receiverPhone} ?: '010-1234-5678'"
                       placeholder="010-0000-0000" required>
            </div>
            <div class="form-group">
                <label>주소</label>
                <input type="text" id="receiverAddress" name="receiverAddress"
                       th:value="${checkoutRequest.receiverAddress} ?: '서울특별시 강남구 테헤란로 123'"
                       placeholder="상세 주소를 입력하세요" required>
            </div>
            <div class="form-group">
                <label>희망 배송일</label>
                <input type="date" th:field="*{requestDeliveryDate}">
            </div>
        </section>

        <section class="order-section">
            <h3>할인 / 결제</h3>

            <div class="discount-row">
                <label>쿠폰 사용</label>
                <select th:field="*{couponId}" id="couponSelect" onchange="updateTotal()"
                        th:disabled="${userId == null}"
                        th:classappend="${userId == null} ? 'disabled-overlay' : ''">
                    <option value="" data-discount="0">사용 안함</option>
                    <option th:each="coupon : ${coupons}"
                            th:value="${coupon.id}"
                            th:data-discount="${coupon.discountValue}"
                            th:text="|${coupon.couponName} (${#numbers.formatInteger(coupon.discountValue, 0, 'COMMA')}원 할인)|">
                        쿠폰명
                    </option>
                </select>
                <span th:if="${userId == null}" class="login-guide">로그인 후 사용 가능</span>
            </div>

            <div class="discount-row">
                <label>포인트 사용 (보유: <span th:text="${#numbers.formatInteger(point, 0, 'COMMA')}">0</span>P)</label>

                <input type="number" th:field="*{usedPoint}" id="usedPoint" value="0" min="0"
                       th:max="${point}"
                       onchange="updateTotal()"
                       th:disabled="${userId == null}"
                       th:classappend="${userId == null} ? 'disabled-overlay' : ''"> P

                <button type="button" onclick="useAllPoints()"
                        style="margin-left: 10px; padding: 5px 10px; cursor: pointer;"
                        th:disabled="${userId == null}"
                        th:classappend="${userId == null} ? 'disabled-overlay' : ''">전액 사용</button>

                <span th:if="${userId == null}" class="login-guide">로그인 후 사용 가능</span>
            </div>

            <div class="form-group" th:if="${userId == null}">
                <label>주문 비밀번호 (비회원 필수)</label>
                <input type="password" th:field="*{orderPassword}" placeholder="주문 조회용 비밀번호 입력" required>
            </div>
        </section>

        <section class="order-section">
            <h3>결제 수단 선택</h3>
            <input type="hidden" name="paymentMethod" id="paymentMethodInput">
            <div class="tabs">
                <div th:if="${#lists.isEmpty(paymentMethods)}" style="width:100%; color:red; padding:10px;">
                    사용 가능한 결제 수단이 없습니다. 관리자에게 문의하세요.
                </div>
                <button th:each="method : ${paymentMethods}"
                        type="button"
                        class="tab"
                        th:data-code="${method.name}"
                        onclick="selectMethod(this)"
                        th:classappend="${!method.active} ? ' disabled' : ''"
                        th:disabled="${!method.active}">
                    <span th:text="${method.alias}">신용카드</span>
                </button>
            </div>
            <div class="pay-content">
                <p id="method-desc">결제 수단을 선택해주세요.</p>
            </div>
        </section>

        <section class="payment-summary">
            <h3>최종 결제 금액</h3>
            <div class="summary-row">
                <span>총 상품 금액</span>
                <span class="amount">
                    <span id="displayProductPrice" th:text="${#numbers.formatInteger(orderSheet.totalProductPrice, 0, 'COMMA')}">0</span>원
                </span>
            </div>
            <div class="summary-row">
                <span>배송비</span>
                <span class="amount">
                    <span id="displayDeliveryFee" th:text="${orderSheet.deliveryFee}">0</span>원
                </span>
            </div>
            <div class="summary-row">
                <span>포장비</span>
                <span class="amount">
                    <span id="displayWrappingFee">0</span>원
                </span>
            </div>
            <div class="summary-row discount">
                <span>할인 금액</span>
                <span class="amount">-<span id="displayDiscount">0</span>원</span>
            </div>
            <hr>
            <div class="total-row">
                <span>총 결제 금액</span>
                <span class="amount final-price">
                    <span id="displayFinalPrice">0</span>원
                </span>
            </div>
        </section>

        <button type="button" class="btn-submit" onclick="requestPayment()">결제하기</button>
    </form>
</div>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: bold;">결제 진행 중...</p>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    // 1. 서버 데이터 주입
    const maxPoint = [[${point != null ? point : 0}]];
    const tossClientKey = [[${tossClientKey}]];
    const customerEmail = [[${orderSheet.email}]];

    // [핵심] 배송비 정책 설정 (서버에서 받아온 값 적용, 없으면 기본값)
    // 🚨 수정된 부분: orderSheet.deliveryPolicy 객체를 통해 접근합니다.
    const FREE_DELIVERY_THRESHOLD = [[${orderSheet.deliveryPolicy.minOrderAmount}]] || 30000;
    const STANDARD_DELIVERY_FEE = [[${orderSheet.deliveryPolicy.standardShippingFee}]] || 3000;

    // 2. 토스 객체 초기화
    const tossPayments = TossPayments(tossClientKey);
    let selectedMethodCode = null;

    // 초기화 함수
    $(document).ready(function() {
        updateTotal(); // 최초 진입 시 금액 계산

        // 첫 번째 결제 수단 자동 선택
        const firstTab = $('.tab:not(.disabled)').first();
        if (firstTab.length > 0) {
            selectMethod(firstTab[0]);
        }
    });

    // ===========================
    // UI 로직 (실시간 금액 재계산)
    // ===========================
    function updateTotal() {
        let currentTotalProductPrice = 0;
        let currentWrappingFee = 0;

        // 1. 각 상품 행(Row)별 계산
        $('.order-item-row').each(function() {
            const price = parseInt($(this).find('.item-price').val()) || 0;
            let quantity = parseInt($(this).find('.item-qty-input').val());

            // 수량 유효성 검사
            if (isNaN(quantity) || quantity < 1) {
                quantity = 1;
            }

            // 상품별 합계 업데이트
            const rowTotal = price * quantity;
            $(this).find('.item-total-price').text(rowTotal.toLocaleString());
            currentTotalProductPrice += rowTotal;

            // 포장비 계산
            const wrapperOption = $(this).find('.wrapper-select option:selected');
            const wrapperPrice = parseInt(wrapperOption.data('price')) || 0;
            currentWrappingFee += (wrapperPrice * quantity);
        });

        // 2. 배송비 재계산 (정책 적용)
        let currentDeliveryFee = STANDARD_DELIVERY_FEE;
        if (currentTotalProductPrice >= FREE_DELIVERY_THRESHOLD) {
            currentDeliveryFee = 0;
        }

        // 3. 할인 계산 (쿠폰 + 포인트)
        // 비활성화된 경우 값은 0으로 처리됨
        const couponDiscount = parseInt($('#couponSelect').find(':selected').data('discount')) || 0;
        let usedPoint = parseInt($('#usedPoint').val()) || 0;

        // 포인트 초과 검사
        if (usedPoint > maxPoint) {
            alert('보유 포인트를 초과할 수 없습니다.');
            usedPoint = maxPoint;
            $('#usedPoint').val(maxPoint);
        }
        if (usedPoint < 0) {
            usedPoint = 0;
            $('#usedPoint').val(0);
        }

        // 4. 최종 금액 계산
        const totalDiscount = couponDiscount + usedPoint;
        let finalPrice = currentTotalProductPrice + currentDeliveryFee + currentWrappingFee - totalDiscount;
        if (finalPrice < 0) finalPrice = 0;

        // 5. 화면 갱신 (콤마 포맷 적용)
        $('#displayProductPrice').text(currentTotalProductPrice.toLocaleString());
        $('#displayDeliveryFee').text(currentDeliveryFee.toLocaleString());
        $('#displayWrappingFee').text(currentWrappingFee.toLocaleString());
        $('#displayDiscount').text(totalDiscount.toLocaleString());
        $('#displayFinalPrice').text(finalPrice.toLocaleString());
    }

    // 포인트 전액 사용 버튼
    function useAllPoints() {
        $('#usedPoint').val(maxPoint);
        updateTotal();
    }

    // 결제 수단 탭 선택
    function selectMethod(element) {
        if ($(element).hasClass("disabled")) return;

        $('.tab').removeClass('active');
        $(element).addClass('active');

        selectedMethodCode = $(element).data("code");
        $('#paymentMethodInput').val(selectedMethodCode);

        const desc = document.getElementById("method-desc");
        if (selectedMethodCode === 'TOSS') {
            desc.innerText = "Toss 위젯을 통해 빠르게 결제 해보세요.";
        } else if (selectedMethodCode === 'BANK_TRANSFER') {
            desc.innerText = "실시간 계좌이체를 진행합니다.";
        } else if (selectedMethodCode === 'VIRTUAL_ACCOUNT') {
            desc.innerText = "가상계좌를 발급받아 입금 후 결제 완료됩니다.";
        } else {
            desc.innerText = "선택한 결제 수단으로 진행합니다.";
        }
    }

    // ===========================
    // 결제 요청 (서버 통신)
    // ===========================
    function requestPayment() {
        if (!selectedMethodCode) {
            alert("결제 수단을 선택해주세요.");
            return;
        }

        const receiverName = $('#receiverName').val();
        const receiverPhone = $('#receiverPhone').val();
        const receiverAddress = $('#receiverAddress').val();

        if (!receiverName || !receiverPhone || !receiverAddress) {
            alert("배송지 정보를 모두 입력해주세요.");
            return;
        }

        $('#loading-overlay').css('display', 'flex');

        const formData = new FormData(document.getElementById('orderForm'));

        $.ajax({
            url: '/orders/api/create',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(response) {
                const orderId = response.orderKey;
                const amount = response.totalAmount;
                const orderName = "HIGH-FIVE 도서 주문";

                const methodMap = {
                    "TOSS": "카드", "BANK_TRANSFER": "계좌이체", "VIRTUAL_ACCOUNT": "가상계좌"
                };
                const tossMethod = methodMap[selectedMethodCode] || "카드";

                tossPayments.requestPayment(tossMethod, {
                    amount: amount,
                    orderId: orderId,
                    orderName: orderName,
                    customerName: receiverName,
                    customerEmail: customerEmail,
                    successUrl: window.location.origin + "/orders/success",
                    failUrl: window.location.origin + "/orders/fail",
                }).catch(function (error) {
                    $('#loading-overlay').hide();
                    if (error.code !== 'USER_CANCEL') {
                        alert("결제 실패: " + error.message);
                    }
                });
            },
            error: function(xhr) {
                $('#loading-overlay').hide();
                let msg = "주문 생성 실패";
                try {
                    const resp = JSON.parse(xhr.responseText);
                    if(resp.message) msg = resp.message;
                    else msg += ": " + xhr.responseText;
                } catch(e) {
                    if (xhr.responseText) msg += ": " + xhr.responseText;
                }
                alert(msg);
            }
        });
    }
    /*]]>*/
</script>

</body>
</html>
