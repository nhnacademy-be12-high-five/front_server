<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>마이페이지 - 포인트</title>
    <link rel="stylesheet" href="/css/member-css/mypage.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/member-css/points.css">
</head>

<script src="/js/common.js"></script>

<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container2">
    <nav class="box">
        <a href="/mypage" class="tab-btn">내 정보</a>
        <a href="/mypage/address" class="tab-btn">배송지</a>
        <a href="/mypage/coupons" class="tab-btn">쿠폰</a>
        <a href="/mypage/points" class="tab-btn active">포인트</a>
        <a href="/mypage/orders" class="tab-btn">주문내역</a>
        <a href="/mypage/reviews" class="tab-btn">리뷰</a>
        <a href="/mypage/likes" class="tab-btn">찜 목록</a>
    </nav>

    <section class="tab-content active" style="display: block;">
        <h2 class="section-title">포인트 관리</h2>

        <div class="points-container">
            <div class="points-box">
                <div class="points-label">보유 포인트</div>
                <div class="points-value"
                     th:text="${#numbers.formatInteger((balance?.currentPoint ?: 0), 0, 'COMMA')}">0</div>
                <div class="points-unit">P</div>
            </div>
            <div class="points-box">
                <div class="points-label">누적 적립 포인트</div>
                <div class="points-value"
                     th:text="${#numbers.formatInteger((balance?.totalEarnedPoint ?: 0), 0, 'COMMA')}">0</div>
                <div class="points-unit">P</div>
            </div>
        </div>

        <div class="points-history">
            <h3>최근 포인트 내역</h3>

            <div class="history-item" th:each="history : ${histories}">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <span class="history-desc"
                          th:text="${history.description}"
                          style="font-weight: 600; color: #333;">상품 구매 적립</span>

                    <span style="font-size: 12px; color: #999;"
                          th:text="${#temporals.format(history.transactionDate, 'yyyy-MM-dd HH:mm')}">2025.01.01</span>
                </div>

                <div style="text-align: right;">
                    <span class="history-amount"
                          th:text="${(history.amount > 0 ? '+' : '') + #numbers.formatInteger(history.amount, 0, 'COMMA') + ' P'}"
                          th:style="${history.amount > 0 ? 'color: #007bff' : 'color: #c0392b'}">
                        + 3,000 P
                    </span>
                    <div style="font-size: 12px; color: #666; margin-top: 4px;">
                        잔액: <span th:text="${#numbers.formatInteger(history.currentPoint, 0, 'COMMA')}">5,000</span> P
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(histories)}" class="empty-message">
                포인트 내역이 없습니다.
            </div>
        </div>

        <div class="pagination" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 0}"
               th:href="@{/mypage/points(page=${currentPage - 1})}" class="page-link">&lt;</a>

            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:href="@{/mypage/points(page=${i})}"
                   th:text="${i + 1}"
                   th:classappend="${i == currentPage} ? 'active' : ''"
                   class="page-link">1</a>
            </span>

            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/mypage/points(page=${currentPage + 1})}" class="page-link">&gt;</a>
        </div>
    </section>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
