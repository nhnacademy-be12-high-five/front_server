<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>찜 목록 | HIGH-FIVE BOOKS</title>

    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <style>
        .mypage-wrap{max-width:1100px;margin:40px auto;padding:0 16px;}
        .mypage-title{font-size:24px;font-weight:800;margin-bottom:16px;}
        .likes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
        @media (max-width: 1024px){.likes-grid{grid-template-columns:repeat(3,1fr);}}
        @media (max-width: 768px){.likes-grid{grid-template-columns:repeat(2,1fr);}}
        @media (max-width: 480px){.likes-grid{grid-template-columns:repeat(1,1fr);}}

        .book-card{background:#fff;border:1px solid #e9e9e9;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);}
        .book-thumb{width:100%;aspect-ratio:3/4;background:#f5f6f8;display:flex;align-items:center;justify-content:center;}
        .book-thumb img{width:100%;height:100%;object-fit:cover;}
        .book-body{padding:12px;}
        .book-title{font-weight:800;font-size:14px;line-height:1.3;margin-bottom:6px;min-height:36px;}
        .book-meta{color:#666;font-size:12px;margin-bottom:10px;}
        .book-actions{display:flex;gap:8px;}
        .btn{flex:1;border:none;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;}
        .btn-primary{background:#0b5ed7;color:#fff;}
        .btn-ghost{background:#f1f3f5;color:#222;}
        .empty{background:#fff;border:1px dashed #ccc;border-radius:14px;padding:24px;color:#666;}
    </style>
</head>
<body>

<div th:replace="layout/header :: header"></div>

<div class="mypage-wrap">
    <div class="mypage-title">찜 목록</div>

    <div th:if="${#lists.isEmpty(likedBooks)}" class="empty">
        아직 찜한 도서가 없습니다. 마음에 드는 책에 하트를 눌러 찜 목록에 추가해 보세요.
    </div>

    <div th:if="${!#lists.isEmpty(likedBooks)}" class="likes-grid">
        <div class="book-card" th:each="b : ${likedBooks}">
            <a th:href="@{/books/{id}(id=${b.bookId})}">
                <div class="book-thumb">
                    <img th:if="${b.imageUrl != null}" th:src="${b.imageUrl}" alt="book"/>
                    <span th:if="${b.imageUrl == null}">이미지 없음</span>
                </div>
            </a>

            <div class="book-body">
                <div class="book-title" th:text="${b.title}">도서 제목</div>
                <div class="book-meta">
                    <span th:text="${b.author}">저자</span>
                </div>

                <div class="book-actions">
                    <button class="btn btn-primary"
                            th:onclick="|location.href='/books/' + ${b.bookId}|">
                        상세보기
                    </button>
                    <button class="btn btn-ghost"
                            th:attr="data-book-id=${b.bookId}"
                            onclick="removeLike(this)">
                        찜 해제
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="layout/footer :: footer"></div>

<script>
    async function removeLike(btn){
        const bookId = btn.getAttribute("data-book-id");
        try{
            // 현재 하트 토글에서 쓰는 동일 엔드포인트 사용 (POST 토글)
            const res = await fetch(`/api/books/${bookId}/likes`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                credentials: "include"
            });
            if(!res.ok){
                alert("찜 해제에 실패했습니다.");
                return;
            }
            location.reload();
        }catch(e){
            console.error(e);
            alert("서버와 통신 중 오류가 발생했습니다.");
        }
    }
</script>

</body>
</html>
