<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Highfive - 마이페이지</title>
    <link rel="stylesheet" href="/css/member-css/mypage.css">
    <link rel="stylesheet" href="/css/member-css/myinfo.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <style>
        .input-readonly { background-color: #f0f0f0; color: #888; cursor: not-allowed; }
        dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
    </style>
</head>

<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container2">
    <nav class="box">
        <a href="/mypage" class="tab-btn active">내 정보</a>
        <a href="/mypage/address" class="tab-btn">배송지</a>
        <a href="/mypage/coupons" class="tab-btn">쿠폰</a>
        <a href="/mypage/points" class="tab-btn">포인트</a>
        <a href="/mypage/orders" class="tab-btn">주문내역</a>
        <a href="/mypage/reviews" class="tab-btn">리뷰</a>
        <a href="/mypage/likes" class="tab-btn">찜 목록</a>
    </nav>

    <section class="tab-content active">
        <h2 class="section-title">내 정보</h2>
        <input type="hidden" id="server-alert-msg" th:value="${alertMessage}" />

        <div id="view-mode">
            <div class="info-group">
                <div class="info-item"><label>이름</label><div th:text="${myInfo.name}"></div></div>
                <div class="info-item"><label>이메일</label><div th:text="${myInfo.email}"></div></div>
                <div class="info-item">
                    <label>생일</label>
                    <div th:text="${myInfo.birthDate.year == 1000 ? '설정 필요' : #temporals.format(myInfo.birthDate, 'yyyy-MM-dd')}"></div>
                </div>
                <div class="info-item"><label>연락처</label><div id="view-phone" th:text="${myInfo.phone}"></div></div>
                <div class="info-item"><label>회원 등급</label><div th:text="${myInfo.gradeName}"></div></div>
            </div>
            <br/>

            <button type="button"
                    class="btn-outline"
                    th:data-email="${myInfo.email}"
                    onclick="openPasswordResetDialog({
                        email: this.getAttribute('data-email'),
                        emailReadonly: true,
                        redirectUrl: '/member/login?pwChanged=true'
                    })">
                비밀번호 변경
            </button>
            <button type="button" class="btn-edit" onclick="toggleEditMode(true)">정보 수정</button>

            <div class="withdrawal-area" style="margin-top:30px; text-align:right;">
                <a href="#" id="btn-withdraw" style="font-size:13px; color:#999; text-decoration:underline;">회원 탈퇴</a>
            </div>
        </div>

        <form id="edit-form" action="/mypage/update" method="post" style="display:none;">
            <div class="info-group">
                <div class="info-item"><label>이름</label><input type="text" name="name" th:value="${myInfo.name}" class="input-field" required></div>
                <div class="info-item"><label>이메일</label><input type="email" name="email" th:value="${myInfo.email}" class="input-field" required></div>
                <div class="info-item">
                    <label>생일</label>
                    <div th:if="${myInfo.birthDate.year == 1000}"><input type="date" name="birthDate" class="input-field" required></div>
                    <div th:unless="${myInfo.birthDate.year == 1000}"><input type="date" th:value="${myInfo.birthDate}" class="input-field input-readonly" readonly></div>
                </div>
                <div class="info-item">
                    <label>연락처</label>
                    <input type="text" id="myInfoPhone" name="phone" th:value="${myInfo.phone}" class="input-field" required maxlength="13" oninput="validateMyInfoForm(this)" placeholder="010-0000-0000">
                </div>
            </div>
            <br/>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button type="submit" id="myInfoSubmitBtn" class="btn-edit" disabled style="opacity: 0.5; cursor: not-allowed;">저장</button>
                <button type="button" class="btn-outline" onclick="toggleEditMode(false)">취소</button>
            </div>
        </form>
    </section>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<div th:replace="~{layout/password-reset-dialog :: passwordResetDialog(null, false)}"></div>

<form id="withdraw-form" action="/mypage/withdraw" method="post" style="display: none;"></form>

<script src="/js/common.js"></script>
<script src="/js/myinfo.js"></script>

<script src="/js/password-reset.js"></script>

<script>
    function validateMyInfoForm(target) {
        target.value = target.value.replace(/[^0-9]/g, '').substring(0, 11)
            .replace(/^(\d{0,3})(\d{0,4})(\d{0,4})$/g, "$1-$2-$3").replace(/(\-{1,2})$/g, "");
        const phoneVal = target.value.replace(/[^0-9]/g, '');
        const submitBtn = document.getElementById('myInfoSubmitBtn');
        if (phoneVal.startsWith('010') && phoneVal.length === 11) {
            submitBtn.disabled = false; submitBtn.style.opacity = "1"; submitBtn.style.cursor = "pointer";
        } else {
            submitBtn.disabled = true; submitBtn.style.opacity = "0.5"; submitBtn.style.cursor = "not-allowed";
        }
    }

    // JS 로드 순서에 따른 toggleEditMode 안전 처리
    if (typeof toggleEditMode !== 'undefined') {
        const originalToggle = toggleEditMode;
        toggleEditMode = function(isEdit) {
            originalToggle(isEdit);
            if (isEdit) {
                const phoneInput = document.getElementById('myInfoPhone');
                if(phoneInput) validateMyInfoForm(phoneInput);
            }
        };
    }
</script>
</body>
</html>
