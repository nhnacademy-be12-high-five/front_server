<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Booktown - 마이페이지</title>
    <link rel="stylesheet" href="/css/member-css/mypage.css">
    <link rel="stylesheet" href="/css/member-css/myinfo.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <style>
        .input-readonly { background-color: #f0f0f0; color: #888; cursor: not-allowed; }
        .info-msg { color: #007bff; font-size: 12px; margin-top: 5px; }
        .error-msg { color: #e74c3c; font-size: 12px; margin-top: 5px; }

        dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
    </style>
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container2">

    <nav class="box">
        <a href="/mypage" class="tab-btn active">내 정보</a>
        <a href="/mypage/address" class="tab-btn">배송지</a>
        <a href="/mypage/coupons" class="tab-btn">쿠폰</a>
        <a href="/mypage/points" class="tab-btn">포인트</a>
        <a href="/mypage/orders" class="tab-btn">주문내역</a>
        <a href="/mypage/reviews" class="tab-btn">리뷰</a>
        <a href="/mypage/likes" class="tab-btn">찜 목록</a>
    </nav>

    <section class="tab-content active">
        <h2 class="section-title">내 정보</h2>

        <div id="view-mode">
            <div class="info-group">
                <div class="info-item">
                    <label>이름</label>
                    <div th:text="${myInfo.name}">홍길동</div>
                </div>
                <div class="info-item">
                    <label>이메일</label>
                    <div th:text="${myInfo.email}">test@test.com</div>
                </div>
                <div class="info-item">
                    <label>생일</label>
                    <div th:text="${myInfo.birthDate.year == 1000 ? '설정 필요 (정보 수정 버튼을 눌러주세요)' : #temporals.format(myInfo.birthDate, 'yyyy-MM-dd')}"></div>
                </div>
                <div class="info-item">
                    <label>연락처</label>
                    <div th:text="${myInfo.phone}">010-0000-0000</div>
                </div>
                <div class="info-item">
                    <label>회원 등급</label>
                    <div th:text="${myInfo.gradeName}">일반</div>
                </div>
            </div>

            <br/>

            <button type="button" class="btn-outline" onclick="openPwModal()" style="margin-right: 8px;">비밀번호 변경</button>

            <button type="button" class="btn-edit" onclick="toggleEditMode(true)">정보 수정</button>

            <div class="withdrawal-area" style="margin-top:30px; text-align:right;">
                <span style="font-size:13px; color:#888;">더 이상 서비스를 이용하지 않으시나요?</span>
                <a href="#" id="btn-withdraw"
                   style="font-size:13px; color:#999; text-decoration:underline; margin-left:10px;">
                    회원 탈퇴
                </a>
            </div>
        </div>

        <form id="edit-form" action="/mypage/update" method="post" style="display:none;">
            <div class="info-group">
                <div class="info-item">
                    <label>이름</label>
                    <input type="text" name="name" th:value="${myInfo.name}" class="input-field" required>
                </div>

                <div class="info-item">
                    <label>이메일</label>
                    <input type="email" name="email" th:value="${myInfo.email}" class="input-field" required>
                </div>

                <div class="info-item">
                    <label>생일</label>
                    <div th:if="${myInfo.birthDate.year == 1000}">
                        <input type="date" name="birthDate" class="input-field" required>
                        <p class="info-msg">* 원활한 서비스 이용을 위해 생년월일을 입력해주세요. (설정 후 변경 불가)</p>
                    </div>
                    <div th:unless="${myInfo.birthDate.year == 1000}">
                        <input type="date"
                               th:value="${myInfo.birthDate}"
                               class="input-field input-readonly"
                               readonly
                               onfocus="this.blur();" onclick="return false;">
                        <p class="error-msg">* 생년월일은 최초 설정 후 변경할 수 없습니다.</p>
                    </div>
                </div>
                <div class="info-item">
                    <label>연락처</label>
                    <input type="text" name="phone" th:value="${myInfo.phone}" class="input-field" required>
                </div>
            </div>

            <br/>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button type="submit" class="btn-edit">저장</button>
                <button type="button" class="btn-outline" onclick="toggleEditMode(false)">취소</button>
            </div>
        </form>

        <form id="withdraw-form" th:action="@{/mypage/withdraw}" method="post" style="display:none;">
        </form>
    </section>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<dialog id="pwChangeDialog" style="padding: 20px; border: 1px solid #888; border-radius: 8px; width: 350px;
               position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); margin: 0; z-index: 9999; background: white;">
    <div style="text-align: right;">
        <button type="button" onclick="closePwModal()" style="border:none; background:none; cursor:pointer; font-size:16px;">X</button>
    </div>

    <h3 style="margin-top:0;">비밀번호 변경</h3>
    <p style="font-size:13px; color:#666;">안전한 변경을 위해 정보를 입력해주세요.</p>

    <div style="margin-bottom: 5px;">
        <input type="text" id="mypageLoginId" placeholder="아이디를 입력하세요"
               style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc;">
    </div>

    <div style="display: flex; gap: 5px; margin-bottom: 5px;">
        <input type="email" id="mypageEmail" th:value="${myInfo.email}" readonly
               style="width: 65%; padding: 8px; background:#f0f0f0; color:#555; border:1px solid #ccc;">
        <button type="button" onclick="sendCodeForPwChange()"
                style="width: 35%; padding: 8px; cursor: pointer; font-size: 12px; background:#eee; border:1px solid #ddd;">인증번호 받기</button>
    </div>

    <div id="pwChangeArea" style="display:none; margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;">
        <p style="font-size:12px; color:blue;">메일이 발송되었습니다.<br>인증번호와 새 비밀번호를 입력하세요.</p>

        <input type="text" id="mypageAuthCode" placeholder="인증번호 6자리"
               style="width: 100%; padding: 8px; margin-bottom: 5px; box-sizing: border-box;">

        <input type="password" id="mypageNewPw" placeholder="새 비밀번호"
               style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">

        <button type="button" onclick="reqChangePw()"
                style="width: 100%; padding: 10px; background-color: #333; color: #fff; border: none; cursor: pointer;">변경하기</button>
    </div>

    <p id="pwResultMsg" style="color: blue; font-weight: bold; text-align: center; margin-top: 15px; font-size: 14px; white-space: pre-wrap;"></p>
</dialog>

<script src="/js/common.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/

    const alertMessage = /*[[${alertMessage}]]*/ null;
    if (alertMessage) {
        alert(alertMessage);
        if (alertMessage.includes("필수 정보")) {
            setTimeout(() => toggleEditMode(true), 100);
        }
    }

    // 2. 수정 모드 토글
    function toggleEditMode(isEdit) {
        const viewMode = document.getElementById('view-mode');
        const editForm = document.getElementById('edit-form');
        if (isEdit) {
            viewMode.style.display = 'none';
            editForm.style.display = 'block';
        } else {
            viewMode.style.display = 'block';
            editForm.style.display = 'none';
            editForm.reset();
        }
    }

    // 3. 회원 탈퇴
    const withdrawBtn = document.getElementById("btn-withdraw");
    const withdrawForm = document.getElementById("withdraw-form");
    if (withdrawBtn) {
        withdrawBtn.addEventListener("click", e => {
            e.preventDefault();
            if (confirm("정말 탈퇴하시겠습니까?")) withdrawForm.submit();
        });
    }

    // ============================================
    // [추가됨] 비밀번호 변경 팝업 로직
    // ============================================
    const pwDialog = document.getElementById('pwChangeDialog');
    const pwResultMsg = document.getElementById('pwResultMsg');
    const pwChangeArea = document.getElementById('pwChangeArea');

    function openPwModal() {
        pwResultMsg.innerText = "";
        pwChangeArea.style.display = 'none';
        document.getElementById('mypageAuthCode').value = "";
        document.getElementById('mypageNewPw').value = "";
        pwDialog.showModal();
    }
    function closePwModal() { pwDialog.close(); }

    // (1) 인증번호 발송 요청
    function sendCodeForPwChange() {
        const email = document.getElementById('mypageEmail').value;
        if(!email) { alert("이메일 정보가 없습니다."); return; }

        pwResultMsg.style.color = "black";
        pwResultMsg.innerText = "전송 중...";

        // 우리가 만든 비밀번호용 발송 API 호출
        fetch('/auth/email/password-reset', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email})
        }).then(async res => {
            if(res.ok) {
                alert("인증번호가 발송되었습니다.");
                pwResultMsg.innerText = "";
                pwChangeArea.style.display = 'block'; // 입력창 표시
            } else {
                const text = await res.text();
                alert("발송 실패: " + text);
                pwResultMsg.innerText = "";
            }
        });
    }

    // (2) 비밀번호 변경 요청
    function reqChangePw() {
        const loginId = document.getElementById('mypageLoginId').value;
        const email = document.getElementById('mypageEmail').value;
        const code = document.getElementById('mypageAuthCode').value;
        const newPw = document.getElementById('mypageNewPw').value;

        if(!code || !newPw) { alert("인증번호와 새 비밀번호를 입력해주세요."); return; }

        pwResultMsg.innerText = "처리 중...";

        // 우리가 만든 비밀번호 변경 API 호출
        fetch('/account/api/find/password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                loginId: loginId,
                email: email,
                authCode: code, // 백엔드 DTO 필드명 확인 (code인지 authCode인지)
                newPassword: newPw
            })
        }).then(async res => {
            if(res.ok) {
                alert("비밀번호가 변경되었습니다.\n보안을 위해 다시 로그인해주세요.");
                location.href = "/auth/logout"; // 로그아웃 처리
            } else {
                const errorText = await res.text();
                alert("변경 실패: " + errorText);
                pwResultMsg.style.color = "red";
                pwResultMsg.innerText = errorText;
            }
        });
    }

    /*]]>*/
</script>

</body>
</html>
