<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Booktown - 마이페이지</title>
    <link rel="stylesheet" href="/css/member-css/mypage.css">
    <link rel="stylesheet" href="/css/member-css/myinfo.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <style>
        .input-readonly { background-color: #f0f0f0; color: #888; cursor: not-allowed; }
        .info-msg { color: #007bff; font-size: 12px; margin-top: 5px; }
        .error-msg { color: #e74c3c; font-size: 12px; margin-top: 5px; }
    </style>
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container2">

    <nav class="box">
        <a href="/mypage" class="tab-btn active">내 정보</a>
        <a href="/mypage/address" class="tab-btn">배송지</a>
        <a href="/mypage/coupons" class="tab-btn">쿠폰</a>
        <a href="/mypage/points" class="tab-btn">포인트</a>
        <a href="/mypage/orders" class="tab-btn">주문내역</a>
        <a href="/mypage/reviews" class="tab-btn">리뷰</a>
        <a href="/mypage/likes" class="tab-btn">찜 목록</a>
    </nav>

    <section class="tab-content active">
        <h2 class="section-title">내 정보</h2>

        <div id="view-mode">
            <div class="info-group">
                <div class="info-item">
                    <label>이름</label>
                    <div th:text="${myInfo.name}">홍길동</div>
                </div>
                <div class="info-item">
                    <label>이메일</label>
                    <div th:text="${myInfo.email}">test@test.com</div>
                </div>
                <div class="info-item">
                    <label>생일</label>
                    <div th:text="${myInfo.birthDate.year == 1000 ? '설정 필요 (정보 수정 버튼을 눌러주세요)' : #temporals.format(myInfo.birthDate, 'yyyy-MM-dd')}"></div>
                </div>
                <div class="info-item">
                    <label>연락처</label>
                    <div th:text="${myInfo.phone}">010-0000-0000</div>
                </div>
                <div class="info-item">
                    <label>회원 등급</label>
                    <div th:text="${myInfo.gradeName}">일반</div>
                </div>
            </div>

            <br/>
            <button type="button" class="btn-edit" onclick="toggleEditMode(true)">정보 수정</button>

            <div class="withdrawal-area" style="margin-top:30px; text-align:right;">
                <span style="font-size:13px; color:#888;">더 이상 서비스를 이용하지 않으시나요?</span>
                <a href="#" id="btn-withdraw"
                   style="font-size:13px; color:#999; text-decoration:underline; margin-left:10px;">
                    회원 탈퇴
                </a>
            </div>
        </div>

        <form id="edit-form" action="/mypage/update" method="post" style="display:none;">
            <div class="info-group">
                <div class="info-item">
                    <label>이름</label>
                    <input type="text" name="name" th:value="${myInfo.name}" class="input-field" required>
                </div>

                <div class="info-item">
                    <label>이메일</label>
                    <input type="email" name="email" th:value="${myInfo.email}" class="input-field" required>
                </div>

                <div class="info-item">
                    <label>생일</label>

                    <div th:if="${myInfo.birthDate.year == 1000}">
                        <input type="date" name="birthDate" class="input-field" required>
                        <p class="info-msg">* 원활한 서비스 이용을 위해 생년월일을 입력해주세요. (설정 후 변경 불가)</p>
                    </div>

                    <div th:unless="${myInfo.birthDate.year == 1000}">
                        <input type="date"
                               th:value="${myInfo.birthDate}"
                               class="input-field input-readonly"
                               readonly
                               onfocus="this.blur();" onclick="return false;">
                        <p class="error-msg">* 생년월일은 최초 설정 후 변경할 수 없습니다.</p>
                    </div>
                </div>
                <div class="info-item">
                    <label>연락처</label>
                    <input type="text" name="phone" th:value="${myInfo.phone}" class="input-field" required>
                </div>
            </div>

            <br/>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button type="submit" class="btn-edit">저장</button>
                <button type="button" class="btn-outline" onclick="toggleEditMode(false)">취소</button>
            </div>
        </form>

        <form id="withdraw-form" th:action="@{/mypage/withdraw}" method="post" style="display:none;">
        </form>
    </section>
</div>

<script src="/js/common.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/

    // 1. 서버에서 보낸 알림 메시지 확인
    const alertMessage = /*[[${alertMessage}]]*/ null;

    if (alertMessage) {
        alert(alertMessage); // 알림창 띄우기

        // "필수 정보"라는 단어가 포함된 메시지라면 자동으로 수정 모드로 전환
        if (alertMessage.includes("필수 정보")) {
            // 화면이 다 그려진 후 실행되도록 약간의 지연
            setTimeout(() => toggleEditMode(true), 100);
        }
    }

    // 2. 수정 모드 토글 함수
    function toggleEditMode(isEdit) {
        const viewMode = document.getElementById('view-mode');
        const editForm = document.getElementById('edit-form');

        if (isEdit) {
            viewMode.style.display = 'none';
            editForm.style.display = 'block';
        } else {
            viewMode.style.display = 'block';
            editForm.style.display = 'none';
            // 취소 시 입력값 초기화
            editForm.reset();
        }
    }

    // 3. 회원 탈퇴 버튼 이벤트
    const withdrawBtn = document.getElementById("btn-withdraw");
    const withdrawForm = document.getElementById("withdraw-form");

    if (withdrawBtn) {
        withdrawBtn.addEventListener("click", e => {
            e.preventDefault();
            if (confirm("정말 탈퇴하시겠습니까?")) {
                withdrawForm.submit();
            }
        });
    }

    /*]]>*/
</script>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
