<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>마이페이지 - 주문 내역</title>
    <link rel="stylesheet" href="/css/member-css/mypage.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/member-css/orders.css">

    <script src="/js/common.js"></script>

</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container2">
    <aside class="mypage-tabs">
        <nav class="box">
            <a href="/mypage" class="tab-btn">내 정보</a>
            <a href="/mypage/address" class="tab-btn">배송지</a>
            <a href="/mypage/coupons" class="tab-btn">쿠폰</a>
            <a href="/mypage/points" class="tab-btn">포인트</a>
            <a href="/mypage/orders" class="tab-btn active">주문내역</a>
            <a href="/mypage/reviews" class="tab-btn">리뷰</a>
            <a href="/mypage/likes" class="tab-btn">찜 목록</a>
        </nav>
    </aside>

    <section class="tab-content active">
        <h2 class="section-title">주문 내역</h2>

        <div th:if="${orders == null || orders.isEmpty()}" class="no-data">
            주문 내역이 없습니다.
        </div>

        <div th:each="order : ${orders}" class="order-card">
            <div class="order-header">
                <div>
                    <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2024-01-01</span>
                    <span style="margin-left: 10px; font-size: 12px; color: #888;"
                          th:text="'(주문번호: ' + ${order.orderId} + ')'"></span>
                </div>
                <div>
                    <span class="status-badge"
                          th:classappend="'status-' + ${order.status}"
                          th:text="${order.status}">WAITING</span>
                </div>
            </div>

            <div class="order-body">
                <div th:each="item : ${order.items}" class="order-item">
                    <span th:text="${item.bookTitle}">책 제목</span>
                    <span>
                        <span th:text="${item.quantity} + '권'">1권</span> /
                        <span th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">10,000원</span>
                    </span>
                </div>
            </div>

            <div class="order-footer">
                총 결제금액: <span th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')}">30,000</span>원

                <div style="margin-top: 10px; display: flex; gap: 10px; justify-content: flex-end;">

                    <button th:if="${order.status == 'WAITING'}"
                            th:onclick="'cancelOrder(' + ${order.orderId} + ')'"
                            class="btn-cancel" style="padding: 5px 10px; font-size: 12px; cursor: pointer; background-color: #f44336; color: white; border: none; border-radius: 4px;">
                        주문 취소
                    </button>

                    <button th:if="${order.status == 'DELIVERING'}"
                            th:onclick="'confirmPurchase(' + ${order.orderId} + ')'"
                            class="btn-confirm" style="padding: 5px 10px; font-size: 12px; cursor: pointer; background-color: #2196F3; color: white; border: none; border-radius: 4px;">
                        구매 확정
                    </button>

                    <span th:if="${order.status == 'COMPLETED'}"
                          style="font-size: 12px; color: #4CAF50; font-weight: bold;">
                        구매 확정 (배송 완료)
                    </span>
                </div>
            </div>
        </div> <div class="pagination" th:if="${page.totalPages > 1}">
        <a th:if="${page.pageNumber > 0}"
           th:href="@{/mypage/orders(page=${page.pageNumber - 1})}"
           class="page-link">&lt;</a>

        <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                <a th:href="@{/mypage/orders(page=${i})}"
                   th:text="${i + 1}"
                   th:classappend="${i == page.pageNumber} ? 'active' : ''"
                   class="page-link">1</a>
            </span>

        <a th:if="${page.pageNumber < page.totalPages - 1}"
           th:href="@{/mypage/orders(page=${page.pageNumber + 1})}"
           class="page-link">&gt;</a>
    </div>

    </section>
</div>

<script>
    function cancelOrder(orderId) {
        if (!confirm('정말 주문을 취소하시겠습니까?')) return;

        fetch(`/orders/api/${orderId}/cancel`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(response => {
                if (response.ok) {
                    alert('주문이 취소되었습니다.');
                    window.location.reload();
                } else {
                    alert('주문 취소에 실패했습니다.');
                }
            })
            .catch(error => console.error('Error:', error));
    }

    function confirmPurchase(orderId) {
        if (!confirm('구매를 확정하시겠습니까? (구매 확정 후에는 반품이 불가합니다)')) return;

        fetch(`/orders/api/${orderId}/confirm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(response => {
                if (response.ok) {
                    alert('구매가 확정되었습니다!');
                    window.location.reload();
                } else {
                    alert('구매 확정에 실패했습니다.');
                }
            })
            .catch(error => console.error('Error:', error));
    }
</script>

</body>
</html>
