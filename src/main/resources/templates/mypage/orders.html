<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>마이페이지 - 주문 내역</title>
    <link rel="stylesheet" href="/css/member-css/mypage.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/member-css/orders.css">

    <script src="/js/common.js"></script>
    <script src="/js/orders.js"></script>
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container2">
    <aside class="mypage-tabs">
        <nav class="box">
            <a href="/mypage" class="tab-btn">내 정보</a>
            <a href="/mypage/address" class="tab-btn">배송지</a>
            <a href="/mypage/coupons" class="tab-btn">쿠폰</a>
            <a href="/mypage/points" class="tab-btn">포인트</a>
            <a href="/mypage/orders" class="tab-btn active">주문내역</a>
            <a href="/mypage/reviews" class="tab-btn">리뷰</a>
            <a href="/mypage/likes" class="tab-btn">찜 목록</a>
        </nav>
    </aside>

    <section class="tab-content active">
        <h2 class="section-title">주문 내역</h2>

        <div th:if="${orders == null || orders.isEmpty()}" class="no-data">
            주문 내역이 없습니다.
        </div>

        <div th:each="order : ${orders}" class="order-card">
            <div class="order-header">
                <div>
                    <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2024-01-01</span>
                    <span style="margin-left: 10px; font-size: 12px; color: #888;"
                          th:text="'(주문번호: ' + ${order.id} + ')'"></span>
                </div>
                <div>
                <span class="status-badge"
                      th:classappend="'status-' + ${order.status}"
                      th:switch="${order.status}">
                    <span th:case="'PREPARING'">배송 준비 중</span>
                    <span th:case="'DELIVERING'">배송 중</span>
                    <span th:case="'DELIVERY_COMPLETED'">배송 완료</span>
                    <span th:case="'PURCHASE_CONFIRMED'">구매 확정</span>
                    <span th:case="'CANCELED'">주문 취소</span>
                    <span th:case="'RETURN_REQUESTED'">반품 요청</span>
                    <span th:case="'RETURN_COMPLETED'">반품 완료</span>
                    <span th:case="*">[[${order.status}]]</span>
                </span>
                </div>
            </div>

            <div class="order-body">
                <div th:each="item : ${order.items}" class="order-item">
        <span class="item-title"
              th:text="${item.bookTitle != null ? item.bookTitle : '책 제목 없음'}">
            책 제목
        </span>
                    <span class="item-meta">
            <span th:text="${item.quantity} + '권'">1권</span>
            <span style="margin: 0 6px; color: #e9ecef;">|</span>
            <span class="item-price"
                  th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">
                10,000원
            </span>
        </span>
                </div>
            </div>

            <div class="order-footer">
                <div style="text-align: right; margin-bottom: 12px; font-weight: 600;">
                    총 결제금액: <span style="color: #d6336c; font-size: 1.1em;"
                                  th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')}">30,000</span>원
                </div>

                <div style="display: flex; gap: 8px; justify-content: flex-end; align-items: center;">

                    <button th:if="${order.status.toString() == 'PREPARING'}"
                            th:onclick="'cancelOrder(' + ${order.id} + ')'"
                            class="btn-action btn-cancel">
                        주문 취소
                    </button>

                    <!-- 구매 확정 버튼 -->
                    <button th:if="${order.status.toString() != 'PURCHASE_CONFIRMED'
               and order.status.toString() != 'CANCELED'
               and order.status.toString() != 'RETURN_REQUESTED'
               and order.status.toString() != 'RETURN_COMPLETED'
               and order.status.toString() == 'PURCHASE_CONFIRMED'}"
                            th:onclick="'confirmPurchase(' + ${order.id} + ')'"
                            class="btn-action btn-confirm">
                        구매 확정
                    </button>

                    <!-- 이미 구매 확정된 경우 버튼 비활성화
                    <button th:if="${order.status.toString() == 'PURCHASE_CONFIRMED'}"
                            disabled
                            class="btn-action btn-confirm disabled">
                        구매 확정
                    </button>-->

                    <button th:if="${order.status.toString() == 'DELIVERY_COMPLETED' or order.status.toString() == 'DELIVERING'
                     or order.status.toString() == 'PURCHASE_CONFIRMED'}"
                            th:onclick="'openReturnModal(' + ${order.id} + ')'"
                            class="btn-action btn-return">
                        반품 신청
                    </button>

                </div>
            </div>

            <div id="returnModal" class="modal-overlay">
                <div class="modal-content">
                    <h3 class="modal-title">반품 신청</h3>
                    <input type="hidden" id="modalOrderId">

                    <div class="form-group">
                        <label for="returnReason">반품 사유</label>
                        <select id="returnReason" class="form-control" onchange="checkReturnFee()">
                            <option value="">사유를 선택하세요</option>
                            <option value="SIMPLE_CHANGE">단순 변심 (반품비 5,000원 차감)</option>
                            <option value="PRODUCT_DEFECT">상품 불량 (무료)</option>
                            <option value="DELIVERY_DELAY">배송 지연 (무료)</option>
                            <option value="WRONG_DELIVERY">오배송 (무료)</option>
                        </select>
                        <div id="feeWarning" class="warning-text">
                            * 단순 변심의 경우 환불 금액에서 배송비 5,000원이 차감됩니다.
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="returnDesc">상세 사유</label>
                        <textarea id="returnDesc" class="form-control" placeholder="상세 사유를 입력해주세요."></textarea>
                    </div>

                    <div class="modal-buttons">
                        <button type="button" class="btn-action" style="background:#ccc;" onclick="closeReturnModal()">취소</button>
                        <button type="button" class="btn-action btn-confirm" onclick="submitReturnRequest()">신청하기</button>
                    </div>
                </div>
            </div>
        </div>

            <div class="pagination" th:if="${page.totalPages > 0}">

            <a th:if="${currentPage > 0}"
               th:href="@{/mypage/orders(page=${currentPage - 1})}" class="page-link">&lt;</a>

            <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                    <a th:href="@{/mypage/orders(page=${i})}"
                       th:text="${i + 1}"
                       th:classappend="${i == currentPage} ? 'active' : ''"
                       class="page-link">1</a>
                </span>

            <a th:if="${currentPage < page.totalPages - 1}"
               th:href="@{/mypage/orders(page=${currentPage + 1})}" class="page-link">&gt;</a>
        </div>

    </section>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
