<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Booktown - 마이페이지</title>
    <link rel="stylesheet" href="/member-css/mypage.css">
    <style>
        .btn-edit { cursor: pointer; }
        .input-readonly { background-color: #f0f0f0; color: #888; cursor: not-allowed; }
        .error-msg { color: #e74c3c; font-size: 12px; margin-top: 5px; }
        .info-msg { color: #007bff; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<header id="header">
    <div class="container">
        <a href="/" class="logo">
            <img src="/img/logo.png" alt="HIGH-FIVE 로고" width="100" height="100"/>
            <div class="brand">HIGH-FIVE BOOKS</div>
        </a>

        <div class="user-menu">
            <a class="user-link" href="/coupon"><img src="/img/icon-coupon.png" alt="쿠폰" class="user-icon"/></a>
            <a class="user-link" href="/mypage"><img src="/img/icon-mypage.png" alt="마이페이지" class="user-icon"/></a>
            <a class="user-link" href="/cart"><img src="/img/icon-cart.png" alt="장바구니" class="user-icon"/></a>

            <a th:if="${myInfo == null}" class="user-link pill" th:href="@{/login}">로그인</a>
            <a th:if="${myInfo != null}" class="user-link pill" th:href="@{/logout}">로그아웃</a>
        </div>
    </div>
</header>

<div class="container2">

    <!-- 탭 네비게이션 (각각 컨트롤러로 이동) -->
    <nav class="box">
        <a href="/mypage" class="tab-btn active">내 정보</a>
        <a href="/mypage/address" class="tab-btn">배송지</a>
        <a href="/mypage/coupons" class="tab-btn">쿠폰</a>
        <a href="/mypage/points" class="tab-btn">포인트</a>
        <a href="/mypage/orders" class="tab-btn">주문내역</a>
        <a href="/mypage/reviews" class="tab-btn">리뷰</a>
        <a href="/mypage/likes" class="tab-btn">찜 목록</a>
    </nav>

    <!-- 내 정보 -->
    <section class="tab-content active">
        <h2 class="section-title">내 정보</h2>

        <!-- 조회 모드 -->
        <div id="view-mode">
            <div class="info-group">
                <div class="info-item">
                    <label>이름</label>
                    <div th:text="${myInfo.name}">홍길동</div>
                </div>
                <div class="info-item">
                    <label>이메일</label>
                    <div th:text="${myInfo.email}">test@test.com</div>
                </div>
                <div class="info-item">
                    <label>생일</label>
                    <div th:text="${#temporals.format(myInfo.birthDate, 'yyyy-MM-dd')}">1995-01-01</div>
                </div>
                <div class="info-item">
                    <label>연락처</label>
                    <div th:text="${myInfo.phone}">010-0000-0000</div>
                </div>
                <div class="info-item">
                    <label>회원 등급</label>
                    <div th:text="${myInfo.gradeName}">일반</div>
                </div>
            </div>

            <br/>
            <button type="button" class="btn-edit" onclick="toggleEditMode(true)">정보 수정</button>

            <div class="withdrawal-area" style="margin-top:30px; text-align:right;">
                <span style="font-size:13px; color:#888;">더 이상 서비스를 이용하지 않으시나요?</span>
                <a href="#" id="btn-withdraw"
                   style="font-size:13px; color:#999; text-decoration:underline; margin-left:10px;">
                    회원 탈퇴
                </a>
            </div>
        </div>

        <!-- 수정 모드 -->
        <form id="edit-form" action="/mypage/update" method="post" style="display:none;">
            <div class="info-group">
                <div class="info-item">
                    <label>이름</label>
                    <input type="text" name="name" th:value="${myInfo.name}" class="input-field" required>
                </div>

                <div class="info-item">
                    <label>이메일</label>
                    <input type="email" name="email" th:value="${myInfo.email}" class="input-field" required>
                </div>

                <div class="info-item">
                    <label>생일</label>
                    <input type="date"
                           th:value="${myInfo.birthDate}"
                           class="input-field input-readonly"
                           readonly>
                    <p class="error-msg">* 생년월일은 최초 설정 후 변경할 수 없습니다.</p>
                </div>

                <div class="info-item">
                    <label>연락처</label>
                    <input type="text" name="phone" th:value="${myInfo.phone}" class="input-field" required>
                </div>
            </div>

            <br/>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button type="submit" class="btn-edit">저장</button>
                <button type="button" class="btn-outline" onclick="toggleEditMode(false)">취소</button>
            </div>
        </form>

        <form id="withdraw-form" action="/mypage/withdraw" method="post" style="display:none;"></form>
    </section>
</div>

<script>
    function toggleEditMode(isEdit) {
        document.getElementById('view-mode').style.display = isEdit ? 'none' : 'block';
        document.getElementById('edit-form').style.display = isEdit ? 'block' : 'none';
        if (!isEdit) document.getElementById('edit-form').reset();
    }

    const withdrawBtn = document.getElementById("btn-withdraw");
    const withdrawForm = document.getElementById("withdraw-form");

    if (withdrawBtn) {
        withdrawBtn.addEventListener("click", e => {
            e.preventDefault();
            if (confirm("정말 탈퇴하시겠습니까?")) {
                withdrawForm.submit();
            }
        });
    }
</script>

</body>
</html>
