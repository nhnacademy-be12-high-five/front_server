<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Highfive - 배송지 관리</title>

    <link rel="stylesheet" href="/css/member-css/mypage.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <style>
        .address-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .address-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .address-table th { background-color: #f8f9fa; text-align: center; font-weight: bold; padding: 12px; border-bottom: 2px solid #ddd; }
        .address-table td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        .btn-add { background-color: #333; color: white; padding: 8px 15px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; }
        .btn-edit, .btn-delete { padding: 5px 10px; border: 1px solid #ddd; background-color: white; color: #333 !important; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 30px; border-radius: 10px; width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .close { float: right; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .zipcode-box { display: flex; gap: 10px; }
        .btn-zipcode { width: 30%; background: #666; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .btn-submit { width: 100%; background-color: #ccc; color: white; padding: 12px; border: none; border-radius: 4px; cursor: not-allowed; font-size: 16px; margin-top: 10px; transition: background-color 0.3s; }
        .btn-submit.active { background-color: #333; cursor: pointer; }
        .error-msg { color: #e74c3c; font-size: 12px; margin-top: 5px; display: none; }

        .container2 {
            max-width: 700px !important;
            /*margin: 120px auto 50px !important;*/
            display: block !important;
        }

        /*.box { display: flex !important; justify-content: center; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }*/
        .tab-btn { padding: 10px 15px; color: #666; text-decoration: none; font-weight: 500; }
        .tab-btn.active { color: #007bff; border-bottom: 2px solid #007bff; font-weight: bold; }
        .tab-content.active { display: block !important; width: 100% !important; }
    </style>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container2">
    <nav class="box">
        <a href="/mypage" class="tab-btn">내 정보</a>
        <a href="/mypage/address" class="tab-btn active">배송지</a>
        <a href="/mypage/coupons" class="tab-btn">쿠폰</a>
        <a href="/mypage/points" class="tab-btn">포인트</a>
        <a href="/mypage/orders" class="tab-btn">주문내역</a>
        <a href="/mypage/reviews" class="tab-btn">리뷰</a>
        <a href="/mypage/likes" class="tab-btn">찜 목록</a>
    </nav>

    <section class="tab-content active">
        <div class="address-header">
            <h2 style="font-size: 20px; font-weight: bold; margin: 0;">
                배송지 관리 (<span th:text="${addresses == null ? 0 : #lists.size(addresses)}">0</span>/10)
            </h2>
            <button type="button" class="btn-add" onclick="openModal()" th:if="${addresses == null or #lists.size(addresses) < 10}">+ 배송지 추가</button>
        </div>

        <table class="address-table">
            <colgroup><col width="15%" /><col width="15%" /><col width="*" /><col width="18%" /><col width="15%" /></colgroup>
            <thead><tr><th>별칭</th><th>받는 분</th><th>주소</th><th>연락처</th><th>관리</th></tr></thead>
            <tbody>
            <tr th:each="addr : ${addresses}">
                <td style="text-align: center; font-weight: bold;" th:text="${addr.alias}">집</td>
                <td style="text-align: center;" th:text="${addr.recipient}">홍길동</td>
                <td>
                    <div style="font-size:12px; color:#666; margin-bottom:2px;" th:text="'[' + ${addr.zipCode} + ']'"></div>
                    <span th:text="${addr.roadAddress}"></span> <span th:text="${addr.detailAddress}" style="color:#555;"></span>
                    <span th:if="${addr.isDefault}" style="color:#007bff; font-size:11px; border:1px solid #007bff; padding:1px 4px; border-radius:3px; margin-left:5px;">기본</span>
                </td>
                <td style="text-align: center;" th:text="${addr.phone}">010-1234-5678</td>
                <td style="text-align: center;">
                    <button type="button" class="btn-edit" th:onclick="|location.href='@{/mypage/address/{id}/update(id=${addr.addressId})}'|">수정</button>
                    <form th:action="@{/mypage/address/{id}/delete(id=${addr.addressId})}" method="post" style="display:inline;" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                        <button type="submit" class="btn-delete">삭제</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${addresses == null or #lists.isEmpty(addresses)}">
                <td colspan="5" style="text-align: center; padding: 60px 0; color: #999;">등록된 배송지가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </section>
</div>

<div id="addressModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 style="margin-top: 0; margin-bottom: 20px;">배송지 추가</h3>
        <form id="addressForm" action="/mypage/address/register" method="post">
            <div class="form-group"><label>별칭</label><input type="text" name="alias" required oninput="validateForm()"></div>
            <div class="form-group"><label>받는 분</label><input type="text" name="recipient" required oninput="validateForm()"></div>
            <div class="form-group">
                <label>연락처</label>
                <input type="text" name="phone" id="phoneInput" oninput="handlePhoneInput(this)" maxlength="13" required placeholder="010-0000-0000">
                <p id="phoneError" class="error-msg">* 010으로 시작하는 11자리 숫자를 입력해주세요.</p>
            </div>
            <div class="form-group">
                <label>주소</label>
                <div class="zipcode-box">
                    <input type="text" id="zipCode" name="zipCode" readonly required placeholder="우편번호">
                    <button type="button" class="btn-zipcode" onclick="execDaumPostcode()">검색</button>
                </div>
            </div>
            <input type="text" id="roadAddress" name="roadAddress" readonly required placeholder="도로명 주소" style="margin-bottom:10px;">
            <div class="form-group">
                <label>상세주소</label>
                <input type="text" id="detailAddress" name="detailAddress" placeholder="상세주소를 입력하세요" required oninput="validateForm()">
            </div>
            <div class="form-group" style="display:flex; align-items:center; gap:5px;">
                <input type="checkbox" id="chkDefault" name="defaultAddress" value="true" style="width:auto;">
                <input type="hidden" name="_defaultAddress" value="on"/>
                <label for="chkDefault" style="margin:0; cursor:pointer;">기본 배송지로 설정</label>
            </div>
            <button type="submit" id="submitBtn" class="btn-submit" disabled>저장하기</button>
        </form>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script>
    function openModal() { document.getElementById('addressModal').style.display = 'block'; validateForm(); }
    function closeModal() { document.getElementById('addressModal').style.display = 'none'; }

    let isMouseDownInside = false;
    document.addEventListener('mousedown', (e) => { isMouseDownInside = e.target.closest('.modal-content') !== null; });
    window.addEventListener('mouseup', (e) => {
        const modal = document.getElementById('addressModal');
        if (e.target === modal && !isMouseDownInside) closeModal();
        isMouseDownInside = false;
    });

    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                document.getElementById('zipCode').value = data.zonecode;
                document.getElementById("roadAddress").value = data.roadAddress;
                document.getElementById("detailAddress").focus();
                validateForm();
            }
        }).open();
    }

    function handlePhoneInput(target) {
        let val = target.value.replace(/[^0-9]/g, '');
        target.value = val.substring(0, 11).replace(/^(\d{0,3})(\d{0,4})(\d{0,4})$/g, "$1-$2-$3").replace(/(\-{1,2})$/g, "");
        const errorMsg = document.getElementById('phoneError');
        if (val.length > 0 && (!val.startsWith('010') || val.length !== 11)) {
            errorMsg.style.display = 'block'; target.style.borderColor = '#e74c3c';
        } else {
            errorMsg.style.display = 'none'; target.style.borderColor = '#ddd';
        }
        validateForm();
    }

    function validateForm() {
        const phoneVal = document.getElementById('phoneInput').value.replace(/[^0-9]/g, '');
        const detailAddr = document.getElementById('detailAddress').value.trim();
        const zipCode = document.getElementById('zipCode').value;
        const submitBtn = document.getElementById('submitBtn');
        const isPhoneValid = phoneVal.startsWith('010') && phoneVal.length === 11;
        if (isPhoneValid && detailAddr.length > 0 && zipCode.length > 0) {
            submitBtn.disabled = false; submitBtn.classList.add('active');
        } else {
            submitBtn.disabled = true; submitBtn.classList.remove('active');
        }
    }
</script>
</body>
</html>
