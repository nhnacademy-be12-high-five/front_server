server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8      # URL 한글 인코딩 (쿼리 파라미터)

spring:
  application:
    name: frontend_server

  servlet:
    encoding:                # 요청/응답 body 인코딩
      charset: UTF-8
      enabled: true
      force: true            # 항상 UTF-8 강제

book:
  api:
    base-url: http://localhost:9003   # Book 서버 주소 (SearchController에서 사용)
