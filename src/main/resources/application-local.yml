server:
  port: 9000
  tomcat:
    uri-encoding: UTF-8      # URL 한글 인코딩 (쿼리 파라미터)

spring:
  cloud:
    config:
      enabled: false           # Config 서버 사용 안 함
      import-check:
        enabled: false
  application:
    name: frontend_server
  servlet:
    encoding:                # 요청/응답 body 인코딩
      charset: UTF-8
      enabled: true
      force: true            # 항상 UTF-8 강제

gateway:
  uri: http://localhost:8000

book:
  api:
    base-url: http://localhost:9002   # Book 서버 주소 (SearchController에서 사용)
jwt:
  expiration_time: 50000
  refresh_expiration_time: 100000
